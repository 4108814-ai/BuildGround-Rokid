<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" role="img" aria-label="A notice band with a title, body text, a footer, and a row of three action chips: Reply selected and outlined in phosphor, then Later and Ignore in dim outlines">
  <rect width="640" height="236" fill="#000000"/>
  <rect x="26" y="16" width="588" height="204" rx="9" fill="#000000" stroke="#1d3226" stroke-width="2"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="52" y="62" font-size="32" font-weight="700" fill="#71FF97">Marie</text>
    <text x="52" y="104" font-size="26" fill="#7E9585">On my way, ten minutes out.</text>
    <text x="52" y="142" font-size="24" fill="#7E9585">scroll to choose · back to dismiss</text>

    <rect x="52" y="160" width="132" height="44" rx="6" fill="#000000" stroke="#71FF97" stroke-width="3"/>
    <circle cx="76" cy="182" r="9" fill="none" stroke="#71FF97" stroke-width="2.5"/>
    <text x="94" y="191" font-size="24" fill="#71FF97">Reply</text>

    <rect x="196" y="160" width="126" height="44" rx="6" fill="#000000" stroke="#13221A" stroke-width="2"/>
    <circle cx="220" cy="182" r="9" fill="none" stroke="#7E9585" stroke-width="2"/>
    <text x="238" y="191" font-size="24" fill="#7E9585">Later</text>

    <rect x="334" y="160" width="146" height="44" rx="6" fill="#000000" stroke="#13221A" stroke-width="2"/>
    <circle cx="358" cy="182" r="9" fill="none" stroke="#7E9585" stroke-width="2"/>
    <text x="376" y="191" font-size="24" fill="#7E9585">Ignore</text>
  </g>
</svg>
