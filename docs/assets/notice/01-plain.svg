<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 172" width="640" height="172" role="img" aria-label="A notice band showing a title and two lines of body text, with no footer and no actions">
  <rect width="640" height="172" fill="#000000"/>
  <rect x="26" y="16" width="588" height="140" rx="9" fill="#000000" stroke="#1d3226" stroke-width="2"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="52" y="62" font-size="32" font-weight="700" fill="#71FF97">Nexus notice</text>
    <text x="52" y="104" font-size="26" fill="#7E9585">A band that arrives, says one</text>
    <text x="52" y="135" font-size="26" fill="#7E9585">thing, and leaves on its own.</text>
  </g>
</svg>
