<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-label="A notice band whose first page carries a picture: a test card with an eight-step brightness ramp above a white disc, then two lines of body text and a footer">
  <rect width="640" height="316" fill="#000000"/>
  <rect x="26" y="16" width="588" height="284" rx="9" fill="#000000" stroke="#1d3226" stroke-width="2"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="52" y="62" font-size="32" font-weight="700" fill="#71FF97">Notice with an image</text>

    <g>
      <rect x="52" y="80" width="536" height="120" fill="#000000" stroke="#13221A" stroke-width="2"/>
      <rect x="53" y="81" width="67" height="65" fill="#202020"/>
      <rect x="120" y="81" width="67" height="65" fill="#3a3a3a"/>
      <rect x="187" y="81" width="67" height="65" fill="#545454"/>
      <rect x="254" y="81" width="67" height="65" fill="#6e6e6e"/>
      <rect x="321" y="81" width="67" height="65" fill="#888888"/>
      <rect x="388" y="81" width="67" height="65" fill="#a2a2a2"/>
      <rect x="455" y="81" width="67" height="65" fill="#bcbcbc"/>
      <rect x="522" y="81" width="65" height="65" fill="#ffffff"/>
      <circle cx="320" cy="176" r="17" fill="#ffffff"/>
    </g>

    <text x="52" y="234" font-size="26" fill="#7E9585">The picture and this text</text>
    <text x="52" y="265" font-size="26" fill="#7E9585">arrived as one message.</text>
    <text x="52" y="292" font-size="24" fill="#7E9585">back to dismiss</text>
  </g>
</svg>
