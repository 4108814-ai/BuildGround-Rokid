<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 178" width="640" height="178" role="img" aria-label="A notice band with a title, one line of body text, and a dim footer reading tap to answer, back to dismiss">
  <rect width="640" height="178" fill="#000000"/>
  <rect x="26" y="16" width="588" height="146" rx="9" fill="#000000" stroke="#1d3226" stroke-width="2"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="52" y="62" font-size="32" font-weight="700" fill="#71FF97">Marie</text>
    <text x="52" y="104" font-size="26" fill="#7E9585">On my way, ten minutes out.</text>
    <text x="52" y="142" font-size="24" fill="#7E9585">tap to answer · back to dismiss</text>
  </g>
</svg>
