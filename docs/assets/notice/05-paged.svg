<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" width="640" height="364" role="img" aria-label="A notice band filled with eight lines of body text, its footer reading scroll to turn pages on the left and a page counter reading 1 of 3 on the right">
  <rect width="640" height="364" fill="#000000"/>
  <rect x="26" y="16" width="588" height="332" rx="9" fill="#000000" stroke="#1d3226" stroke-width="2"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="52" y="62" font-size="32" font-weight="700" fill="#71FF97">Long notice</text>
    <text x="52" y="104" font-size="26" fill="#7E9585">This band carries more text than</text>
    <text x="52" y="135" font-size="26" fill="#7E9585">a single page can hold, which is</text>
    <text x="52" y="166" font-size="26" fill="#7E9585">the whole point of it: a relayed</text>
    <text x="52" y="197" font-size="26" fill="#7E9585">message is as long as whoever</text>
    <text x="52" y="228" font-size="26" fill="#7E9585">wrote it decided, and a tier that</text>
    <text x="52" y="259" font-size="26" fill="#7E9585">only ever showed the first four</text>
    <text x="52" y="290" font-size="26" fill="#7E9585">lines was not relaying anything.</text>
    <text x="52" y="330" font-size="24" fill="#7E9585">scroll to turn pages</text>
    <text x="588" y="330" font-size="24" fill="#47584D" text-anchor="end">1/3</text>
  </g>
</svg>
