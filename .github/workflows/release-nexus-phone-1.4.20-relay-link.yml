name: Release Nexus Phone 1.4.20 Relay link recovery

on:
  push:
    branches:
      - feature/nexus-phone-1420-relay-link
    paths:
      - '.github/scripts/apply-nexus-phone-1420-relay-link.py'
      - '.github/workflows/release-nexus-phone-1.4.20-relay-link.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-nexus-phone-1-4-20-relay-link
  cancel-in-progress: false

jobs:
  release-phone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Relay link recovery and prepare Phone 1.4.20
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python RokidNexus/.github/scripts/apply-nexus-phone-1420-relay-link.py RokidNexus

          gradle='RokidNexus/phone-hub/build.gradle.kts'
          hub='RokidNexus/phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt'
          grep -F 'versionCode = 10420' "$gradle"
          grep -F 'versionName = "1.4.20"' "$gradle"
          grep -F 'private val sppRetryWake = java.util.concurrent.Semaphore(0)' "$hub"
          grep -F 'sppRetryWake.tryAcquire(delayMs, TimeUnit.MILLISECONDS)' "$hub"
          grep -F 'if (glassBtConnected) 2_000L else 30_000L' "$hub"
          grep -F 'wakeSppRetry("glass_bt_up")' "$hub"

          # Preserve the already-released 1.4.19 installed-version authority fix.
          grep -F 'installedVersionNames' \
            RokidNexus/phone-hub/src/main/java/com/anezium/rokidbus/phone/StoreCatalog.kt
          grep -F 'installedVersions(context.packageManager, packageNames)' \
            RokidNexus/phone-hub/src/main/java/com/anezium/rokidbus/phone/StoreUi.kt
          grep -F 'installed entry displays package version name when registry snapshot is stale' \
            RokidNexus/phone-hub/src/test/java/com/anezium/rokidbus/phone/StoreCatalogTest.kt

          # This is a phone-only transport recovery patch.
          changed="$(git -C RokidNexus status --porcelain | awk '{print $2}')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^phone-hub/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Unexpected generated source changes outside phone-hub:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Test Nexus phone
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :phone-hub:testDebugUnitTest

      - name: Build debug smoke APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleDebug

      - name: Decode permanent BuildGround signing key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"
          echo "ARTIFACT_SIGNER_SHA256=$(printf '%s' "$actual" | tr -d ':' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - name: Build signed Nexus Phone 1.4.20 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleRelease

      - name: Verify APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find phone-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          artifact="$RUNNER_TEMP/nexus-phone-1.4.20.apk"
          cp "$apk" "$artifact"

          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$artifact" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$signer" = "$ARTIFACT_SIGNER_SHA256"

          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$artifact" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.phone'"
          printf '%s\n' "$badging" | grep -F "versionCode='10420'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.20'"

          sha="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          size="$(stat -c %s "$artifact")"
          notes="$RUNNER_TEMP/nexus-phone-1.4.20-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Phone 1.4.20 — Relay Link Recovery.

          - Removes a measured architectural latency ceiling in the phone-to-glasses SPP data plane used by Relay notices.
          - The existing permanent SPP thread no longer has to sleep through an old exponential-backoff interval after CXR-L reports that the glasses Bluetooth link has returned.
          - A glasses-Bluetooth-up callback now wakes the pending SPP retry immediately.
          - While glasses Bluetooth is known up, failed SPP recovery retries are capped at 2 seconds; while glasses are absent, the existing battery-friendly 30-second ceiling remains.
          - Preserves Nexus Phone 1.4.19 installed-plugin version authority.
          - Phone-only change: no NEXUS Glasses, Meetings, recorder, Relay capture/filter, STT or audio behavior is modified.
          - Designed to pair with BuildGround Relay 1.2.3, which keeps the Relay plugin registration prewarmed between notifications.

          ### Artifact
          - File: nexus-phone-1.4.20.apk
          - SHA-256: $sha
          - Size: $size bytes
          - Signer SHA-256: $signer
          EOF
          {
            echo "ARTIFACT=$artifact"
            echo "ARTIFACT_SHA=$sha"
            echo "ARTIFACT_SIZE=$size"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Nexus Phone 1.4.20 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.4.20'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" "$ARTIFACT" \
            --target "$GITHUB_SHA" \
            --title 'Rokid Nexus Phone 1.4.20 — Relay Link Recovery' \
            --notes-file "$RELEASE_NOTES" \
            --latest

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-phone-1.4.20-signed
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
