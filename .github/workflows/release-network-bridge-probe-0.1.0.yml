name: Release NEXUS Network Bridge Probe 0.1.0

on:
  push:
    branches:
      - feature/network-bridge-probe-010
    paths:
      - 'glasses-client-probe/**'
      - '.github/workflows/release-network-bridge-probe-0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-network-bridge-probe-0-1-0
  cancel-in-progress: false

jobs:
  release-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Network Bridge probe source contract
        shell: bash
        run: |
          set -euo pipefail
          activity='glasses-client-probe/src/main/java/com/anezium/rokidbus/clientprobe/ProbeActivity.kt'
          manifest='glasses-client-probe/src/main/AndroidManifest.xml'
          gradle='glasses-client-probe/build.gradle.kts'

          grep -F 'https://api.openai.com/v1/models' "$activity"
          grep -F 'LinkStateBits.SPP_DATA_UP' "$activity"
          grep -F 'PATH_HTTP_REQUEST' "$activity"
          grep -F 'BRIDGE OK' "$activity"
          grep -F '401 EXPECTED: no API key used' "$activity"
          grep -F 'android.intent.action.MAIN' "$manifest"
          grep -F 'android.intent.category.LAUNCHER' "$manifest"
          grep -F 'versionCode = 10' "$gradle"
          grep -F 'versionName = "0.1.0-bg-bridge"' "$gradle"

          if grep -R -F 'android.permission.INTERNET' glasses-client-probe/src/main/AndroidManifest.xml; then
            echo '::error::Probe must not use glasses Internet directly'
            exit 1
          fi

      - name: Build debug smoke APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :glasses-client-probe:assembleDebug

      - name: Decode permanent BuildGround signing key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"
          echo "ARTIFACT_SIGNER_SHA256=$(printf '%s' "$actual" | tr -d ':' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - name: Build signed Network Bridge probe APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :glasses-client-probe:assembleRelease

      - name: Verify APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find glasses-client-probe/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          artifact="$RUNNER_TEMP/nexus-network-bridge-probe-0.1.0.apk"
          cp "$apk" "$artifact"

          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$artifact" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$signer" = "$ARTIFACT_SIGNER_SHA256"

          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$artifact" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.clientprobe'"
          printf '%s\n' "$badging" | grep -F "versionCode='10'"
          printf '%s\n' "$badging" | grep -F "versionName='0.1.0-bg-bridge'"

          sha="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          size="$(stat -c %s "$artifact")"
          notes="$RUNNER_TEMP/network-bridge-probe-notes.md"
          cat > "$notes" <<EOF
          BuildGround NEXUS Network Bridge Probe 0.1.0.

          - Standalone glasses-side probe; does not replace or modify NEXUS Glasses 1.4.26.
          - Waits for SPP_DATA_UP, then sends https://api.openai.com/v1/models through the existing RokidBus /http/request path.
          - The glasses APK intentionally has no INTERNET permission, so it cannot contact OpenAI directly.
          - Expected physical success: BRIDGE OK with any real HTTP status; HTTP 401 is expected because the probe deliberately uses no API key.
          - Successful 401 proves the complete path: Rokid -> SPP -> NEXUS Phone -> phone network/VPN -> OpenAI -> NEXUS Phone -> SPP -> Rokid.
          - BRIDGE FAIL shows a bus/client error. BRIDGE TIMEOUT means SPP was up but no terminal HTTP response returned within 30 seconds.
          - Requires NEXUS Phone 1.4.25 Network Bridge and the existing NEXUS Glasses hub.

          ### Artifact
          - File: nexus-network-bridge-probe-0.1.0.apk
          - Package: com.anezium.rokidbus.clientprobe
          - versionCode: 10
          - versionName: 0.1.0-bg-bridge
          - SHA-256: $sha
          - Size: $size bytes
          - Signer SHA-256: $signer
          EOF
          {
            echo "ARTIFACT=$artifact"
            echo "ARTIFACT_SHA=$sha"
            echo "ARTIFACT_SIZE=$size"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Network Bridge probe release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='network-bridge-probe-v0.1.0-bg'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" "$ARTIFACT" \
            --target "$GITHUB_SHA" \
            --title 'NEXUS Network Bridge Probe 0.1.0' \
            --notes-file "$RELEASE_NOTES"

      - name: Upload signed probe APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-network-bridge-probe-0.1.0-signed
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
