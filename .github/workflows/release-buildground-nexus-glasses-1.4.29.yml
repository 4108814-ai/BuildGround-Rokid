name: Release BuildGround Nexus Glasses 1.4.29 SPP wake keeper

on:
  push:
    branches:
      - buildground/nexus-glasses-1.4.29-spp-keeper
    paths:
      - '.github/scripts/apply-buildground-spp-keeper-1429.py'
      - '.github/workflows/release-buildground-nexus-glasses-1.4.29.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-glasses-1-4-29
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround fork
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply stable Glasses chain and 1.4.29 SPP wake keeper
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-buildground-lifecycle-1418.py
          python .github/scripts/apply-buildground-native-recording-1420.py
          python .github/scripts/apply-buildground-native-recording-1421.py
          python .github/scripts/apply-buildground-native-recording-1422.py
          python .github/scripts/apply-buildground-notice-viewport-1423.py
          python .github/scripts/apply-buildground-notice-wake-1424.py
          python .github/scripts/apply-buildground-autostart-1425.py
          python .github/scripts/apply-buildground-autostart-1426.py
          python .github/scripts/apply-buildground-bootkeeper-1427.py
          python .github/scripts/apply-buildground-bootkeeper-1428.py
          python .github/scripts/apply-buildground-spp-keeper-1429.py

          policy='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/DisplayWakePolicy.kt'
          renderer='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/NoticeOverlayRenderer.kt'
          service='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/BusHubService.kt'
          boot='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/BootReceiver.kt'
          manifest='glasses-hub/src/main/AndroidManifest.xml'
          transport='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/TransportWakeReceiver.kt'
          lifecycle='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/GlassesLifecycleReceiver.kt'
          accessibility='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/RokidBusAccessibilityService.kt'
          ime='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/NexusRemoteInputMethodService.kt'

          grep -F 'versionCode = 10429' glasses-hub/build.gradle.kts
          grep -F 'versionName = "1.4.29"' glasses-hub/build.gradle.kts

          # Preserve physically confirmed viewport and fresh-notice wake behavior.
          grep -F 'isInteractive && !(kind == DisplayWakeKind.NOTICE && newNotice)' "$policy"
          grep -F 'PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP' "$policy"
          grep -F 'topMarginPx: Int' "$renderer"
          grep -F 'remainingViewport' "$renderer"

          # Preserve Direct Boot Keeper from 1.4.28.
          grep -F 'android.intent.action.LOCKED_BOOT_COMPLETED' "$manifest"
          test "$(grep -c 'android:directBootAware="true"' "$manifest")" -ge 2
          grep -F 'Intent.ACTION_LOCKED_BOOT_COMPLETED' "$boot"
          grep -F 'UserManager::class.java' "$service"
          grep -F 'UNLOCK_RETRY_MS = 5_000L' "$service"
          grep -F 'startForegroundService' "$service"
          grep -F 'return START_STICKY' "$service"

          # 1.4.29: no visible launcher dependency for transport recovery.
          grep -F 'android:name=".TransportWakeReceiver"' "$manifest"
          grep -F 'android.bluetooth.device.action.ACL_CONNECTED' "$manifest"
          grep -F 'android.bluetooth.adapter.action.CONNECTION_STATE_CHANGED' "$manifest"
          grep -F 'android.intent.action.USER_PRESENT' "$manifest"
          grep -F 'android:stopWithTask="false"' "$manifest"
          grep -F 'BluetoothDevice.ACTION_ACL_CONNECTED' "$transport"
          grep -F 'BluetoothAdapter.ACTION_CONNECTION_STATE_CHANGED' "$transport"
          grep -F 'BusHubService.ensureRunning(appContext)' "$transport"
          grep -F 'reason=${reason ?: "transport_edge"}' "$lifecycle"
          grep -F 'BusHubService.ensureRunning(applicationContext)' "$accessibility"
          grep -F 'BusHubService.ensureRunning(applicationContext)' "$ime"

          # Glasses-only generated source.
          changed="$(git status --porcelain | awk '{print $2}')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(glasses-hub/|\.github/)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Unexpected generated changes outside glasses-hub/.github:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run glasses tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :glasses-hub:testDebugUnitTest

      - name: Build debug smoke APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :glasses-hub:assembleDebug

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"

      - name: Build signed glasses APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :glasses-hub:assembleRelease

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find glasses-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          artifact="$RUNNER_TEMP/nexus-glasses-1.4.29.apk"
          cp "$apk" "$artifact"

          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$artifact" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$signer" = "$expected"

          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$artifact" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.glasses'"
          printf '%s\n' "$badging" | grep -F "versionCode='10429'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.29'"

          sha="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          size="$(stat -c %s "$artifact")"
          notes="$RUNNER_TEMP/nexus-glasses-1.4.29-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Glasses 1.4.29 — SPP Wake Keeper.

          - Physical trigger: after glasses reboot/link loss, NEXUS Phone could show CXR-L control Up and SPP data Down; manually opening NEXUS on the glasses made SPP data Up.
          - Adds a headless transport-wake receiver for Bluetooth ACL connect, adapter reconnect/enable and USER_PRESENT. These events re-establish the foreground Nexus core without opening the launcher.
          - Rokid wear/temple lifecycle broadcasts now reassert the core on every transport edge; known resume states continue accessibility repair.
          - Android-managed AccessibilityService and remote IME process entries now explicitly establish BusHubService foreground ownership before starting GlassesHub.
          - The visible Nexus launcher remains a recovery edge but is no longer intended to be the special edge required for SPP.
          - BusHubService is explicitly stopWithTask=false and keeps the 1.4.28 Direct Boot Keeper / START_STICKY ownership.
          - Keeps physically confirmed 1.4.23 notice viewport repair and 1.4.24 fresh-notice wake policy unchanged.
          - Glasses-only release: NEXUS Phone, Relay, VPN, Android Auto and native Rokid Assistant routing are not modified.
          - Installs normally over 1.4.28 without uninstall/data reset.

          Package: com.anezium.rokidbus.glasses
          versionCode: 10429
          versionName: 1.4.29
          SHA-256: $sha
          Size: $size bytes
          Signer SHA-256: $signer
          EOF
          sed -i 's/^          //' "$notes"
          {
            echo "ARTIFACT=$artifact"
            echo "ARTIFACT_SHA=$sha"
            echo "ARTIFACT_SIZE=$size"
            echo "NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Nexus Glasses 1.4.29 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='nexus-glasses-v1.4.29'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" "$ARTIFACT" --target "$GITHUB_SHA" --title 'Nexus Glasses 1.4.29 — SPP Wake Keeper' --notes-file "$NOTES" --latest=false

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-glasses-1.4.29-signed
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
