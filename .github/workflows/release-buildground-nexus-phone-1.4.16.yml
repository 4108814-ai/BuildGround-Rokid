name: Release BuildGround Nexus Phone 1.4.16

on:
  push:
    branches:
      - feature/nexus-phone-1416-assistant-routing
    paths:
      - '.github/workflows/release-buildground-nexus-phone-1.4.16.yml'
      - '.github/scripts/apply-phone-1416-assistant-routing.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-phone-1-4-16
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Phone 1.4.16 Assistant routing fix
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-phone-1416-assistant-routing.py
          python - <<'PY'
          from pathlib import Path
          p = Path('phone-hub/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          if text.count('versionCode = 10405') != 1 or text.count('versionName = "1.4.5"') != 1:
              raise SystemExit('Expected Phone 1.4.5 source baseline exactly once')
          text = text.replace('versionCode = 10405', 'versionCode = 10416', 1)
          text = text.replace('versionName = "1.4.5"', 'versionName = "1.4.16"', 1)
          p.write_text(text, encoding='utf-8')
          PY

          grep -F 'versionCode = 10416' phone-hub/build.gradle.kts
          grep -F 'versionName = "1.4.16"' phone-hub/build.gradle.kts
          grep -F 'lastGlassAiAssistStartAtMs' phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt
          ! grep -F 'if (!glassAiAssistActive.compareAndSet(false, true)) return' phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt
          ! grep -F 'android.permission.READ_PHONE_STATE' phone-hub/src/main/AndroidManifest.xml
          ! grep -R -F 'PHONE_CALL_STATE' shared/src/main phone-hub/src/main

          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(phone-hub/|shared/|bus-client/)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Unexpected generated changes outside Phone stable runtime modules:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run Phone routing tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :shared:testDebugUnitTest :phone-hub:testDebugUnitTest :bus-client:testDebugUnitTest

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          echo "certificate SHA256=$actual"
          test "$actual" = "$expected"

      - name: Build signed Nexus Phone 1.4.16 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleRelease

      - name: Verify Phone APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          dir='phone-hub/build/outputs/apk/release'
          mapfile -t files < <(find "$dir" -maxdepth 1 -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          phone="$RUNNER_TEMP/nexus-phone-1.4.16.apk"
          cp "${files[0]}" "$phone"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          output="$("$apksigner" verify --print-certs "$phone" 2>&1)"
          digest="$(printf '%s\n' "$output" | sed -nE 's/.*[Ss][Hh][Aa]-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$digest" = "$expected"

          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          badging="$("$aapt" dump badging "$phone" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.phone'"
          printf '%s\n' "$badging" | grep -F "versionCode='10416'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.16'"

          sha256="$(sha256sum "$phone" | cut -d ' ' -f 1)"
          notes="$RUNNER_TEMP/nexus-phone-1.4.16-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Phone 1.4.16 — deterministic Assistant routing.

          - Keeps the stable Phone 1.4.14 runtime foundation and Meeting Audio Transport.
          - Fixes a sticky glassAiAssistActive race that could make separate Hey Rokid invocations intermittently fall through to native Rokid Assistant.
          - Distinct wake-word START events are now routed independently; only duplicate CXR START callbacks inside a 600 ms burst are suppressed.
          - A failed assistant resolution clears the active latch instead of poisoning the next wake-word attempt.
          - No READ_PHONE_STATE, phone-call bridge, Glasses runtime, telephony, Relay, or audio-routing changes.
          - Permanent BuildGround signer verified before publish: $digest.

          Artifact SHA-256: $sha256
          EOF
          sed -i 's/^          //' "$notes"
          {
            echo "PHONE_APK=$phone"
            echo "PHONE_SHA256=$sha256"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub release v1.4.16
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.16 >/dev/null 2>&1; then
            echo '::error::Release v1.4.16 already exists; refusing overwrite.'
            exit 1
          fi
          gh release create v1.4.16 "$PHONE_APK" --target "$GITHUB_SHA" --title 'Rokid Nexus Phone 1.4.16' --notes-file "$RELEASE_NOTES" --latest=false

      - name: Upload verified Phone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-phone-1.4.16-signed-release
          path: ${{ runner.temp }}/nexus-phone-1.4.16.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
