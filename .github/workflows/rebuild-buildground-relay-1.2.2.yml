name: Rebuild BuildGround Relay 1.2.2

on:
  push:
    branches:
      - buildground/relay-1.2.2-rebuild
    paths:
      - '.github/workflows/rebuild-buildground-relay-1.2.2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BuildGround controls
        uses: actions/checkout@v6
        with:
          path: BuildGround
          fetch-depth: 0

      - name: Check out exact upstream Relay 1.2.1 baseline
        uses: actions/checkout@v6
        with:
          repository: Anezium/Rokid-Nexus
          ref: relay-v1.2.1
          path: RokidNexus
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate BuildGround Relay 1.2.2
        shell: bash
        run: |
          set -euo pipefail
          python BuildGround/.github/scripts/apply-relay-122-fifo.py RokidNexus
          python - <<'PY'
          from pathlib import Path
          p = Path('RokidNexus/plugins/relay/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          if text.count('versionCode = 10') != 1 or text.count('versionName = "1.2.1"') != 1:
              raise SystemExit('Expected exact Relay 1.2.1 baseline')
          text = text.replace('versionCode = 10', 'versionCode = 11', 1)
          text = text.replace('versionName = "1.2.1"', 'versionName = "1.2.2"', 1)
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'versionCode = 11' RokidNexus/plugins/relay/build.gradle.kts
          grep -F 'versionName = "1.2.2"' RokidNexus/plugins/relay/build.gradle.kts
          grep -F 'RelayCoalescingQueue' RokidNexus/plugins/relay/src/main/java/com/anezium/rokidbus/plugin/relay/RelayNoticeRuntime.kt

      - name: Run Relay tests
        working-directory: RokidNexus
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :plugin-relay:testDebugUnitTest -PskipCxrGlobal=true

      - name: Decode permanent BuildGround signing key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build signed Relay APK
        working-directory: RokidNexus
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :plugin-relay:assembleRelease -PskipCxrGlobal=true

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          dir='RokidNexus/plugins/relay/build/outputs/apk/release'
          apk="$(find "$dir" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          out="$RUNNER_TEMP/relay-phone-1.2.2-bg.apk"
          cp "$apk" "$out"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$signer" = "$expected"
          echo "Relay SHA-256: $(sha256sum "$out" | cut -d ' ' -f 1)"
          echo "RELAY_APK=$out" >> "$GITHUB_ENV"

      - name: Upload signed Relay APK
        uses: actions/upload-artifact@v4
        with:
          name: buildground-relay-1.2.2-parallel-rebuild
          path: ${{ env.RELAY_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
