name: Trigger Meetings 1.0.3 release

on:
  push:
    branches:
      - feature/meetings-103
    paths:
      - '.github/workflows/trigger-meetings-103-release.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Meetings release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run meetings-buildground-release-1.0.3.yml --repo "$GITHUB_REPOSITORY" --ref feature/meetings-103
