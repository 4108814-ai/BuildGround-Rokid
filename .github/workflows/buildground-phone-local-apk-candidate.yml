      - name: Apply exact bounded diagnostic patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil,os,hashlib,json,xml.etree.ElementTree as ET
          root=Path.cwd().resolve(); target=root/'glasses-hub'; assert target.parent==root
          backup=Path(os.environ['RUNNER_TEMP'])/'unused-phone-baseline-glasses-module'
          assert not backup.exists(); target.rename(backup)
          shutil.copytree('../GlassesSource/glasses-hub',target)
          inputs=Path('../CandidatePatch/.github/candidates')
          for name,digest in {'nexus-spp-diagnostic.patch':'54e6f1f76de0666a10b0e6c7add0cda07c0302b374f20f888615a32cb5ee864e','spp-diagnostic-source-verification.json':'916f522324de1b2aac8ef01038a5e64f52af20c8bb12e65cd533c4d07b4adf59','verify-spp-diagnostic-artifact.py':'4996157f7b285bfe969da733714e7938bb548b6a0e1a17d711c1c8aa22fcdaea','diagnostic_apk_manifest_guard.py':'a49d8238e27d8fd6c371ebc79a1e6e4791af6f527411d06669294aea517ad136','diagnostic-baseline-manifests.json':'f6a155f57e8c59a300277bca0952f8f729ef6db59b6169a9c34b7e8cae3caab6'}.items():
              assert hashlib.sha256((inputs/name).read_bytes()).hexdigest()==digest,name
          for module in ['phone-hub','glasses-hub']:
              Path('../'+module+'-baseline-manifest.xml').write_bytes((Path(module)/'src/main/AndroidManifest.xml').read_bytes())
          PY
          git apply --check ../CandidatePatch/.github/candidates/nexus-spp-diagnostic.patch
          git apply ../CandidatePatch/.github/candidates/nexus-spp-diagnostic.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,xml.etree.ElementTree as ET
          proof=json.loads(Path('../CandidatePatch/.github/candidates/spp-diagnostic-source-verification.json').read_text())
          for row in proof['files']:
              assert hashlib.sha256(Path(row['path']).read_bytes().replace(b'\r\n',b'\n')).hexdigest()==row['sha256'],row['path']
          for module in ['phone-hub','glasses-hub']:
              before=ET.parse('../'+module+'-baseline-manifest.xml').getroot();after=ET.parse(Path(module)/'src/main/AndroidManifest.xml').getroot()
              assert [x.attrib for x in before if x.tag.startswith(('uses-permission','permission'))]==[x.attrib for x in after if x.tag.startswith(('uses-permission','permission'))]
              out=Path(module)/'src/main/assets/buildground-spp-diagnostic.json';out.parent.mkdir(parents=True,exist_ok=True)
              out.write_text(json.dumps({'build_label':'SPP_DIAG_01_20261101','source_commit':'0552dad2d93d2c070a7ffb653c1550d37c15382f','patch_sha256':proof['patch_sha256'],'call':'UNSUPPORTED','physical_validation':'NOT_RUN'})+'\n')
          PY

