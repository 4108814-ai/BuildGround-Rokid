      - name: Build and verify candidate using existing release key
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          NEXUS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          NEXUS_RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$NEXUS_RELEASE_KEYSTORE_PASSWORD"
          test -n "$NEXUS_RELEASE_KEY_ALIAS"
          export NEXUS_RELEASE_KEYSTORE="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          trap 'rm -f "$NEXUS_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$NEXUS_RELEASE_KEYSTORE"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          certificate="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass:env NEXUS_RELEASE_KEYSTORE_PASSWORD -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          digest="$(printf '%s\n' "$certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$digest" = "$expected"
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/spp-diagnostic-pair"
          export PAIR_OUT="$RUNNER_TEMP/spp-diagnostic-pair"
          ./gradlew --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/candidate-repositories.init.gradle" :glasses-hub:assembleRelease
          mapfile -t apks < <(find glasses-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "$PAIR_OUT/NEXUS_GLASSES_SPP_DIAGNOSTIC_2026-11-01.apk"
          python ../CandidatePatch/.github/candidates/verify-spp-diagnostic-artifact.py glasses-hub "$PAIR_OUT/NEXUS_GLASSES_SPP_DIAGNOSTIC_2026-11-01.apk" "$PAIR_OUT"
          export GLASSES_SHA="$(sha256sum "$PAIR_OUT/NEXUS_GLASSES_SPP_DIAGNOSTIC_2026-11-01.apk" | cut -d' ' -f1)"
          python - <<'PY'
          from pathlib import Path
          import os,re,hashlib,json
          p=Path('phone-hub/src/main/java/com/anezium/rokidbus/phone/LocalGlassesApkPolicy.kt')
          s=p.read_text();old='bffde442763cb71471a41b5d050f8b4a6832612567e3b80748d094f55002de03';new=os.environ['GLASSES_SHA']
          assert re.fullmatch('[0-9a-f]{64}',new) and s.count(old)==1
          before=hashlib.sha256(p.read_bytes()).hexdigest()
          p.write_text(s.replace(old,new))
          receipt={'glasses_signed_sha256':new,'policy_before_sha256':before,'policy_after_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'change':'exact CANDIDATE_SHA only; package/version/signer/recovery unchanged'}
          Path(os.environ['PAIR_OUT'],'phone-picker-pin.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          ./gradlew --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/candidate-repositories.init.gradle" :phone-hub:testDebugUnitTest --tests '*LocalGlassesApkPolicyTest'
          ./gradlew --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/candidate-repositories.init.gradle" :phone-hub:assembleRelease
          mapfile -t apks < <(find phone-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "$PAIR_OUT/NEXUS_PHONE_04_SPP_DIAGNOSTIC_2026-11-01.apk"
          python ../CandidatePatch/.github/candidates/verify-spp-diagnostic-artifact.py phone-hub "$PAIR_OUT/NEXUS_PHONE_04_SPP_DIAGNOSTIC_2026-11-01.apk" "$PAIR_OUT"
          cp ../CandidatePatch/.github/candidates/spp-diagnostic-source-verification.json "$PAIR_OUT/"
          (cd "$PAIR_OUT" && sha256sum *.apk > SHA256SUMS)
          printf '%s\n' 'SPP DIAGNOSTIC ONLY. Install nothing until Glasses baseline/recovery compatibility is checked. No physical PASS. Phone04 picker accepts exactly the Glasses APK in this pair. Existing-dot Call UNSUPPORTED. Do not uninstall/delete data or change security settings. Rollback files remain separately preserved.' > "$PAIR_OUT/README.txt"

