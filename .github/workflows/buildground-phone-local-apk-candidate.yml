          for name,digest in checks.items():assert hashlib.sha256(pathlib.Path(name).read_bytes().replace(b'\r\n',b'\n')).hexdigest()==digest,name
          label={'build_label':'CONTROL-FIX-03-20261101','source_commit':'81e797dd674ac8277897891c33c7570a58f5b9ef','owner_patch_sha256':'183291fd7d710ead8dcc491c23ee9bfb4608a4fb4e1989fe5a032b2d39964524','fold_patch_sha256':'a831e04ad85b8f6621d5c4ab0ac5eee8968f2fca0a0a457a62196f6022172fa9','spp_patch_sha256':'b6135691227de68fb420e4352c746439cc36023042533deeb5294ee7dc884cc5','call':'UNSUPPORTED'}
