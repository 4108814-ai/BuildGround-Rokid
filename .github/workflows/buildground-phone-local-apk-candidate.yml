          package com.anezium.rokidbus.phone
          class SppPhoneOwnershipRegressionTest {
              @org.junit.Test fun sevenChecks() { main() }
          }
          KOTLIN
          cp ../CandidatePatch/.github/candidates/CxrOwnerLifecycleRegression.kt "$destination/CxrOwnerLifecycleRegression.kt"
          python - <<'PY'
          from pathlib import Path
          destination=Path('phone-hub/src/test/java/com/anezium/rokidbus/phone')
          # Relocate implementation-identical helper copies into the test module. Production
          # helpers stay internal to their own modules; no duplicate release FQCN is created.
          for source,name in [('../CxrGlobal/lib/src/main/java/com/example/cxrglobal/CxrBindingOwner.kt','OwnerRegressionBinding.kt'),('phone-hub/src/main/java/com/anezium/rokidbus/phone/CxrRecoveryPolicy.kt','OwnerRegressionPolicy.kt')]:
              text=Path(source).read_text(encoding='utf-8')
              first,rest=text.split('\n',1)
              assert first in ['package com.example.cxrglobal','package com.anezium.rokidbus.phone']
              (destination/name).write_text('package com.buildground.ownerregression\n'+rest,encoding='utf-8')
          PY
          cat > "$destination/CxrOwnerLifecycleRegressionTest.kt" <<'KOTLIN'
          package com.anezium.rokidbus.phone
          class CxrOwnerLifecycleRegressionTest {
              @org.junit.Test fun nineteenChecks() { com.buildground.ownerregression.main() }
          }
          KOTLIN
          cat > "$RUNNER_TEMP/candidate-repositories.init.gradle" <<'GRADLE'
          gradle.settingsEvaluated { settings ->
              def allowed = ['dl.google.com', 'maven.google.com', 'repo.maven.apache.org', 'repo1.maven.org', 'plugins.gradle.org', 'maven.rokid.com']
              settings.dependencyResolutionManagement.repositories.removeAll { repository ->
                  repository.hasProperty('url') && repository.url.scheme != 'file' && !allowed.contains(repository.url.host)
              }
              settings.dependencyResolutionManagement.repositories.maven {
                  url = uri('https://jitpack.io')
                  content { includeVersion('com.github.Flyfish233', 'spake2-java', '1.0.5') }
              }
          }
          GRADLE
          ./gradlew --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/candidate-repositories.init.gradle" :phone-hub:testDebugUnitTest --tests '*LocalGlassesApkPolicyTest' --tests '*LocalGlassesTransferBoundaryTest' --tests '*SppPhoneOwnershipRegressionTest' --tests '*CxrOwnerLifecycleRegressionTest'
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path('phone-hub/build/test-results/testDebugUnitTest').glob('TEST-*LocalGlasses*.xml'))
          assert len(reports) == 2
          roots = [ET.parse(p).getroot() for p in reports]
          assert sum(int(x.get('tests')) for x in roots) == 12
          assert all(int(x.get('failures')) == int(x.get('errors')) == int(x.get('skipped')) == 0 for x in roots)
          spp = ET.parse('phone-hub/build/test-results/testDebugUnitTest/TEST-com.anezium.rokidbus.phone.SppPhoneOwnershipRegressionTest.xml').getroot()
          assert spp.get('failures') == '0' and spp.get('errors') == '0'
          assert (spp.findtext('system-out') or '').count('PASS ') == 7
          owner=ET.parse('phone-hub/build/test-results/testDebugUnitTest/TEST-com.anezium.rokidbus.phone.CxrOwnerLifecycleRegressionTest.xml').getroot()
          assert all(int(owner.get(k,'0'))==0 for k in ['failures','errors','skipped'])
          assert (owner.findtext('system-out') or '').count('PASS ')==19
          print('All 38 checks passed: 12 policy/boundary, 7 SPP ownership, 19 single-owner lifecycle checks.')
          PY

