name: BuildGround Phone local APK signed candidate
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildground-phone-cxr-fold-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == '4108814-ai/BuildGround-Rokid' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: RokidNexus
    steps:
      - name: Check out exact Phone baseline
        uses: actions/checkout@v6
        with:
          ref: 060797bbae975e95ca6a22c88378e6fadec58640
          path: RokidNexus
          persist-credentials: false

      - name: Check out reviewed patch only
        uses: actions/checkout@v6
        with:
          ref: 1adfb8aa415ca001ab6c1bf3d12496019001fa05
          path: CandidatePatch
          persist-credentials: false
          sparse-checkout: |
            .github/candidates/nexus-phone-local-apk.patch
            .github/candidates/nexus-phone-spp-session-owner.patch
            .github/candidates/SppPhoneRegression.kt
            .github/candidates/nexus-phone-cxr-fold.patch
            .github/candidates/CxrFoldRecoveryRegression.kt
            .github/candidates/CxrFoldWakeRegression.kt
          sparse-checkout-cone-mode: false

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: bfc3fab18268d6dd4b2c371416189cb19610b631
          path: CxrGlobal
          persist-credentials: false

      - name: Verify and apply exact generated Phone candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 060797bbae975e95ca6a22c88378e6fadec58640
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('../CandidatePatch/.github/candidates/nexus-phone-local-apk.patch')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'ba6b561256d1571254539795d41ca7415598e09cef5cca336fbb5704900f9308'
          PY
          git apply --check ../CandidatePatch/.github/candidates/nexus-phone-local-apk.patch
          git apply ../CandidatePatch/.github/candidates/nexus-phone-local-apk.patch
          python - <<'PY'
          import hashlib, pathlib, subprocess, xml.etree.ElementTree as ET
          expected = {
              "phone-hub/build.gradle.kts": "fde50287f83b83b25c86eadbf98879e85a2fb049180a0840508e2f23370e04ea",
              "phone-hub/src/main/AndroidManifest.xml": "957526ff227ecaeab31b2e4fa9999abeee4df8c451445313b3167355519d477f",
              "phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt": "43eff11b423d4892703032b675cf6b8959a98e339ba5792daeedb8d2fdc2e6d1",
              "phone-hub/src/main/java/com/anezium/rokidbus/phone/HttpProxyPolicy.kt": "cf562566e730c1ca139645e07ec8f6655afb9482c3bce7afdc48cbedabd331e5",
              "phone-hub/src/main/java/com/anezium/rokidbus/phone/LocalGlassesApkActivity.kt": "7e28433641141f533fd81a11baa4d5fb9ae5b79644d62b96f3a25a8711fa99b2",
              "phone-hub/src/main/java/com/anezium/rokidbus/phone/LocalGlassesApkPolicy.kt": "82133a18f1e2833a020c676ff6d8cab1125fd053b0c0700d89f4ee989f39f34c",
              "phone-hub/src/main/java/com/anezium/rokidbus/phone/LocalGlassesApkStore.kt": "69ec5a7fd25b3f7781caf72442fce1939937231f44492bb2fbc628570fbf4e30",
              "phone-hub/src/main/java/com/anezium/rokidbus/phone/PluginGuardianPolicy.kt": "21c7a956116766254ccd05242eca3d05e955b2b4a900f34467c9b63a117e840a",
              "phone-hub/src/main/java/com/anezium/rokidbus/phone/SettingsActivity.kt": "98944293e065706b180112a8319a3fc6a0ccad91128c40846d911a56ab803543",
              "phone-hub/src/test/java/com/anezium/rokidbus/phone/HttpProxyPolicyTest.kt": "b0501f01f2b2fabb647a0dd1bf73f2d009cc348cdb619c9f983b78b182d59642",
              "phone-hub/src/test/java/com/anezium/rokidbus/phone/LocalGlassesApkPolicyTest.kt": "b43b30b9572a17a948b7b7d0b781b3810d2e66b5ce57f9fc4494b7a1296a8eb1",
              "phone-hub/src/test/java/com/anezium/rokidbus/phone/LocalGlassesTransferBoundaryTest.kt": "b0c3e5751983d357bbea081d880ab446562d600b4f7780f4e2360b2aacb458a9",
              "phone-hub/src/test/java/com/anezium/rokidbus/phone/PluginGuardianCoordinatorTest.kt": "fec575bdc7c0ce2f7f9077a1898f8d2564b95c303334165ce4cd8e454f02e2d5",
              "phone-hub/src/test/java/com/anezium/rokidbus/phone/PluginGuardianPolicyTest.kt": "f0d77f22982079e2ea0011f6ddef83a161bbcd568e82c8ee1887851182bb1a48"
          }
          for name, sha in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes().replace(b'\r\n', b'\n')).hexdigest() == sha, name
          before = ET.fromstring(subprocess.check_output(['git', 'show', 'HEAD:phone-hub/src/main/AndroidManifest.xml']))
          after = ET.parse('phone-hub/src/main/AndroidManifest.xml').getroot()
          assert [x.attrib for x in before.findall('uses-permission')] == [x.attrib for x in after.findall('uses-permission')]
          print('Exact 14-file generated Phone candidate verified; permissions unchanged.')
          PY
          python - <<'PY'
          import hashlib, pathlib
          patch = pathlib.Path('../CandidatePatch/.github/candidates/nexus-phone-spp-session-owner.patch')
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == 'b6135691227de68fb420e4352c746439cc36023042533deeb5294ee7dc884cc5'
          PY
          git apply --check ../CandidatePatch/.github/candidates/nexus-phone-spp-session-owner.patch
          git apply ../CandidatePatch/.github/candidates/nexus-phone-spp-session-owner.patch
          python - <<'PY'
          import hashlib, pathlib, json
          expected = {"phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt":"513d2e079dab0427f32c857ef4682594a7c357116398d44f17d0aadf438e66fd","phone-hub/src/main/java/com/anezium/rokidbus/phone/SppClientSessionOwner.kt":"87b88ccc4bf052f18db9cc6fc2418c47b7bc46e401f0be8bb436999b24a9b61d"}
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes().replace(b'\r\n',b'\n')).hexdigest() == digest, name
          regression = pathlib.Path('../CandidatePatch/.github/candidates/SppPhoneRegression.kt')
          assert hashlib.sha256(regression.read_bytes()).hexdigest() == 'e659d329a169c54f56f09d31462f049390798388a8ff6bffdd9c3ed2dedf7e35'
          p = pathlib.Path('phone-hub/src/main/assets/buildground-spp-phone-candidate.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'build_label':'SPP-PHONE-20261031-01','source_commit':'1adfb8aa415ca001ab6c1bf3d12496019001fa05','patch_sha256':'b6135691227de68fb420e4352c746439cc36023042533deeb5294ee7dc884cc5','call':'UNSUPPORTED'})+'\n',encoding='utf-8')
          print('Exact Phone SPP ownership source verified; original candidate and permissions preserved.')
          PY
          grep -F 'applicationId = "com.anezium.rokidbus.phone"' phone-hub/build.gradle.kts
          grep -F 'versionCode = 10426' phone-hub/build.gradle.kts
          grep -F 'versionName = "1.4.26"' phone-hub/build.gradle.kts
          test -z "$(git status --porcelain | awk '{print $2}' | grep -v '^phone-hub/' || true)"

      - name: Verify and apply reviewed Phone and CXR fold recovery
        run: |
          set -euo pipefail
          test "$(git -C ../CxrGlobal rev-parse HEAD)" = bfc3fab18268d6dd4b2c371416189cb19610b631
          python - <<'PY'
          import pathlib,hashlib
          base=pathlib.Path('../CandidatePatch/.github/candidates')
          checks={'nexus-phone-cxr-fold.patch':'a831e04ad85b8f6621d5c4ab0ac5eee8968f2fca0a0a457a62196f6022172fa9','CxrFoldRecoveryRegression.kt':'001f14baf824618a977f66442fa9d27e9892c24f18a6df0ee1a46e4d778cc752','CxrFoldWakeRegression.kt':'39e1579cbbf25f2c5eea4807c0f2b6846b9212c4e0bc1151a65658fbd5b3603c'}
          for name,digest in checks.items(): assert hashlib.sha256((base/name).read_bytes()).hexdigest()==digest,name
          old=pathlib.Path('../CxrGlobal/lib/src/main/java/com/example/cxrglobal/CXRLink.kt')
          assert hashlib.sha256(old.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='435c717046b29a41b8550d86aebb2dffff1fe27d118c1d81e96fdd825ff55af4'
          patch=(base/'nexus-phone-cxr-fold.patch').read_text()
          assert [line for line in patch.splitlines() if line.startswith('+++ ')]==['+++ b/phone/phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt','+++ b/CxrGlobal/lib/src/main/java/com/example/cxrglobal/CXRLink.kt']
          PY
          git apply -p2 --check --include='phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt' ../CandidatePatch/.github/candidates/nexus-phone-cxr-fold.patch
          git apply -p2 --include='phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt' ../CandidatePatch/.github/candidates/nexus-phone-cxr-fold.patch
          git -C ../CxrGlobal apply -p2 --check --include='lib/src/main/java/com/example/cxrglobal/CXRLink.kt' ../CandidatePatch/.github/candidates/nexus-phone-cxr-fold.patch
          git -C ../CxrGlobal apply -p2 --include='lib/src/main/java/com/example/cxrglobal/CXRLink.kt' ../CandidatePatch/.github/candidates/nexus-phone-cxr-fold.patch
          python - <<'PY'
          import pathlib,hashlib,json
          checks={'phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt':'87278986e646a1309bc14b50a9693057d2d7e6ae159725c24b281b744582285b','../CxrGlobal/lib/src/main/java/com/example/cxrglobal/CXRLink.kt':'f566d016b54b56db1f5deeaf503466f267a2887c83e0c08e2a6bbc057e0fab00','phone-hub/src/main/java/com/anezium/rokidbus/phone/SppClientSessionOwner.kt':'87b88ccc4bf052f18db9cc6fc2418c47b7bc46e401f0be8bb436999b24a9b61d'}
          for name,digest in checks.items(): assert hashlib.sha256(pathlib.Path(name).read_bytes().replace(b'\r\n',b'\n')).hexdigest()==digest,name
          label={'build_label':'CXR-FOLD-20261101-01','source_commit':'1adfb8aa415ca001ab6c1bf3d12496019001fa05','fold_patch_sha256':'a831e04ad85b8f6621d5c4ab0ac5eee8968f2fca0a0a457a62196f6022172fa9','spp_patch_sha256':'b6135691227de68fb420e4352c746439cc36023042533deeb5294ee7dc884cc5','call':'UNSUPPORTED'}
          pathlib.Path('phone-hub/src/main/assets/buildground-spp-phone-candidate.json').write_text(json.dumps(label)+'\n',encoding='utf-8')
          print('Exact Phone and CXR fold patches verified; session ownership preserved.')
          PY
          test "$(git -C ../CxrGlobal diff --name-only)" = lib/src/main/java/com/example/cxrglobal/CXRLink.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Use hosted Android SDK with previously accepted licenses
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run reviewed tests before decoding any key
        run: |
          set -euo pipefail
          chmod +x gradlew
          destination=phone-hub/src/test/java/com/anezium/rokidbus/phone
          cp ../CandidatePatch/.github/candidates/SppPhoneRegression.kt "$destination/SppPhoneRegression.kt"
          cat > "$destination/SppPhoneOwnershipRegressionTest.kt" <<'KOTLIN'
          package com.anezium.rokidbus.phone
          class SppPhoneOwnershipRegressionTest {
              @org.junit.Test fun sevenChecks() { main() }
          }
          KOTLIN
          cp ../CandidatePatch/.github/candidates/CxrFoldRecoveryRegression.kt "$destination/CxrFoldRecoveryRegression.kt"
          cp ../CandidatePatch/.github/candidates/CxrFoldWakeRegression.kt "$destination/CxrFoldWakeRegression.kt"
          cat > "$destination/CxrFoldRecoveryRegressionTest.kt" <<'KOTLIN'
          package com.anezium.rokidbus.phone
          class CxrFoldRecoveryRegressionTest {
              @org.junit.Test fun sixteenChecks() { com.buildground.foldregression.main() }
          }
          KOTLIN
          cat > "$destination/CxrFoldWakeRegressionTest.kt" <<'KOTLIN'
          package com.anezium.rokidbus.phone
          class CxrFoldWakeRegressionTest {
              @org.junit.Test fun sixChecks() { com.buildground.wakeregression.main() }
          }
          KOTLIN
          cat > "$RUNNER_TEMP/candidate-repositories.init.gradle" <<'GRADLE'
          gradle.settingsEvaluated { settings ->
              def allowed = ['dl.google.com', 'maven.google.com', 'repo.maven.apache.org', 'repo1.maven.org', 'plugins.gradle.org', 'maven.rokid.com']
              settings.dependencyResolutionManagement.repositories.removeAll { repository ->
                  repository.hasProperty('url') && repository.url.scheme != 'file' && !allowed.contains(repository.url.host)
              }
              settings.dependencyResolutionManagement.repositories.maven {
                  url = uri('https://jitpack.io')
                  content { includeVersion('com.github.Flyfish233', 'spake2-java', '1.0.5') }
              }
          }
          GRADLE
          ./gradlew --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/candidate-repositories.init.gradle" :phone-hub:testDebugUnitTest --tests '*LocalGlassesApkPolicyTest' --tests '*LocalGlassesTransferBoundaryTest' --tests '*SppPhoneOwnershipRegressionTest' --tests '*CxrFoldRecoveryRegressionTest' --tests '*CxrFoldWakeRegressionTest'
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path('phone-hub/build/test-results/testDebugUnitTest').glob('TEST-*LocalGlasses*.xml'))
          assert len(reports) == 2
          roots = [ET.parse(p).getroot() for p in reports]
          assert sum(int(x.get('tests')) for x in roots) == 12
          assert all(int(x.get('failures')) == int(x.get('errors')) == int(x.get('skipped')) == 0 for x in roots)
          spp = ET.parse('phone-hub/build/test-results/testDebugUnitTest/TEST-com.anezium.rokidbus.phone.SppPhoneOwnershipRegressionTest.xml').getroot()
          assert spp.get('failures') == '0' and spp.get('errors') == '0'
          assert (spp.findtext('system-out') or '').count('PASS ') == 7
          for name,count in [('CxrFoldRecoveryRegressionTest',16),('CxrFoldWakeRegressionTest',6)]:
              item=ET.parse('phone-hub/build/test-results/testDebugUnitTest/TEST-com.anezium.rokidbus.phone.'+name+'.xml').getroot()
              assert all(int(item.get(k,'0'))==0 for k in ['failures','errors','skipped'])
              assert (item.findtext('system-out') or '').count('PASS ')==count
          print('All 41 checks passed: 12 policy/boundary, 7 SPP ownership, 16 CXR lifecycle, 6 wake edges.')
          PY

      - name: Build and verify candidate using existing release key
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          NEXUS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          NEXUS_RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$NEXUS_RELEASE_KEYSTORE_PASSWORD"
          test -n "$NEXUS_RELEASE_KEY_ALIAS"
          export NEXUS_RELEASE_KEYSTORE="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          trap 'rm -f "$NEXUS_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$NEXUS_RELEASE_KEYSTORE"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          certificate="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass:env NEXUS_RELEASE_KEYSTORE_PASSWORD -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          digest="$(printf '%s\n' "$certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$digest" = "$expected"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/candidate-repositories.init.gradle" :phone-hub:assembleRelease
          mapfile -t apks < <(find phone-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/phone-cxr-fold-candidate"
          artifact="$RUNNER_TEMP/phone-cxr-fold-candidate/nexus-phone-1.4.26-cxr-fold-20261101-candidate.apk"
          cp "${apks[0]}" "$artifact"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$artifact" > "$RUNNER_TEMP/phone-cxr-fold-candidate/signature.txt"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/phone-cxr-fold-candidate/signature.txt" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$signer" = "$expected"
          test "$(grep -c 'certificate SHA-256 digest:' "$RUNNER_TEMP/phone-cxr-fold-candidate/signature.txt")" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$artifact" > "$RUNNER_TEMP/phone-cxr-fold-candidate/badging.txt"
          head -n 1 "$RUNNER_TEMP/phone-cxr-fold-candidate/badging.txt" | grep -F "name='com.anezium.rokidbus.phone'" | grep -F "versionCode='10426'" | grep -F "versionName='1.4.26'"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/phone-cxr-fold-candidate/badging.txt"; then exit 1; fi
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 "$artifact"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$artifact" > "$RUNNER_TEMP/phone-cxr-fold-candidate/permissions.txt"
          cp phone-hub/build/test-results/testDebugUnitTest/TEST-com.anezium.rokidbus.phone.SppPhoneOwnershipRegressionTest.xml "$RUNNER_TEMP/phone-cxr-fold-candidate/spp-regression.xml"
          cp phone-hub/build/test-results/testDebugUnitTest/TEST-*LocalGlasses*.xml "$RUNNER_TEMP/phone-cxr-fold-candidate/"
          cp phone-hub/build/test-results/testDebugUnitTest/TEST-com.anezium.rokidbus.phone.CxrFoldRecoveryRegressionTest.xml "$RUNNER_TEMP/phone-cxr-fold-candidate/cxr-fold-regression.xml"
          cp phone-hub/build/test-results/testDebugUnitTest/TEST-com.anezium.rokidbus.phone.CxrFoldWakeRegressionTest.xml "$RUNNER_TEMP/phone-cxr-fold-candidate/cxr-wake-regression.xml"
          python - "$artifact" <<'PY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              assert apk.testzip() is None
              assert not any(pathlib.PurePosixPath(n).suffix.lower() in ('.jks','.keystore','.p12','.pfx','.key') for n in apk.namelist())
              import re, json
              label = json.loads(apk.read('assets/buildground-spp-phone-candidate.json'))
              assert label['build_label'] == 'CXR-FOLD-20261101-01' and label['fold_patch_sha256'] == 'a831e04ad85b8f6621d5c4ab0ac5eee8968f2fca0a0a457a62196f6022172fa9' and label['call'] == 'UNSUPPORTED'
              dex = b''.join(apk.read(n) for n in apk.namelist() if re.fullmatch(r'classes\d*\.dex', n))
              assert b'Lcom/anezium/rokidbus/phone/SppClientSessionOwner;' in dex
              assert b'refreshDeviceConnection' in dex and b'requestCxrRecoveryForSppRetry' in dex and b'glasses_worn' in dex
              expected_text = [" \u00b7 ", " \u203a", "AUTO \u203a", "Asking the glasses to check their helper\u2026", "MANUAL \u203a", "Nothing to repair \u2014 the helper is already in place.", "READY \u203a", "Repair \u203a", "SET UP \u203a", "Turn on Wi-Fi first \u2014 the update travels to the glasses over Wi-Fi.", "Working\u2026", "\u203a"]
              corrupt_text = [" \u0420\u00a0\u0432\u0402\u2122\u0420\u2019\u0412\u00b7 ", " \u0432\u0402\u0454", "AUTO \u0432\u0402\u0454", "Asking the glasses to check their helper\u0432\u0402\u00a6", "MANUAL \u0432\u0402\u0454", "Nothing to repair \u0432\u0402\u201d the helper is already in place.", "READY \u0432\u0402\u0454", "Repair \u0432\u0402\u0454", "SET UP \u0432\u0402\u0454", "Turn on Wi-Fi first \u0420\u00a0\u0420\u2020\u0420\u00a0\u0432\u0402\u0459\u0420\u0406\u0420\u201a\u0421\u045a the update travels to the glasses over Wi-Fi.", "Working\u0432\u0402\u00a6", "\u0432\u0402\u0454"]
              assert all(value.encode('utf-8') in dex for value in expected_text), 'Restored UI text absent from APK'
              assert all(value.encode('utf-8') not in dex for value in corrupt_text), 'Corrupt UI text remains in APK'
              print('All 12 restored UI literals verified in signed APK; corrupt variants absent.')
          PY
          (
            cd "$RUNNER_TEMP/phone-cxr-fold-candidate"
            sha256sum nexus-phone-1.4.26-cxr-fold-20261101-candidate.apk > SHA256SUMS
            cat SHA256SUMS
          )
          printf '%s\n' 'CXR-FOLD-20261101-01: Phone CXR binding/status recovery plus previous session-ownership fix, Android version 1.4.26/10426 unchanged. No device install or Bluetooth validation. Existing-dot Call UNSUPPORTED.' > "$RUNNER_TEMP/phone-cxr-fold-candidate/README.txt"

      - name: Remove temporary release key
        if: always()
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"

      - name: Upload signed candidate and verification records only
        uses: actions/upload-artifact@v4
        with:
          name: nexus-phone-1.4.26-cxr-fold-candidate
          path: ${{ runner.temp }}/phone-cxr-fold-candidate/
          if-no-files-found: error
          retention-days: 14

