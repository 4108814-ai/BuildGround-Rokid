name: Release BuildGround Nexus Glasses 1.4.15

on:
  push:
    branches:
      - feature/nexus-glasses-1415-native-telephony-safe
    paths:
      - '.github/workflows/release-buildground-nexus-glasses-1.4.15.yml'
      - '.github/scripts/apply-nexus-glasses-1415-native-telephony-safe.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-glasses-1-4-15
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply native-telephony-safe Glasses 1.4.15 patch
        shell: bash
        run: |
          set -euo pipefail
          base='030bcb22625bf3514d688b2bac68fed9105c8ff8'
          git merge-base --is-ancestor "$base" HEAD
          python .github/scripts/apply-nexus-glasses-1415-native-telephony-safe.py

          grep -F 'versionCode = 10415' glasses-hub/build.gradle.kts
          grep -F 'versionName = "1.4.15"' glasses-hub/build.gradle.kts
          grep -F 'minimumHeight = dp(38)' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/LauncherOverlayRenderer.kt
          grep -F 'scroll.smoothScrollTo' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/LauncherOverlayRenderer.kt
          ! grep -F 'FLAG_KEEP_SCREEN_ON' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/LauncherOverlayRenderer.kt

          # The Accessibility service must be bit-for-bit the released Glasses 1.4.4 service.
          service='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/RokidBusAccessibilityService.kt'
          expected_service_blob='0e334e8fe7435aee17a011249358a5131b6bcc84'
          actual_service_blob="$(git hash-object "$service")"
          echo "service blob=$actual_service_blob"
          test "$actual_service_blob" = "$expected_service_blob"

          # Runtime mutation is restricted to exactly two files.
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'generated runtime changes:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'glasses-hub/build.gradle.kts'
          test "${changed[1]}" = 'glasses-hub/src/main/java/com/anezium/rokidbus/glasses/LauncherOverlayRenderer.kt'

          # Hard negative checks for every later call/wake experiment.
          test ! -e glasses-hub/src/main/java/com/anezium/rokidbus/glasses/LauncherAutoRestorePolicy.kt
          test ! -e glasses-hub/src/main/java/com/anezium/rokidbus/glasses/NativeRokidCallWindowPolicy.kt
          ! grep -F 'launcherAutoRestoreCompleted' "$service"
          ! grep -F 'remotePhoneCallActive' "$service"
          ! grep -F 'registerNativeCallModeObserver' "$service"

      - name: Run Nexus Glasses tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :glasses-hub:testDebugUnitTest

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          echo "certificate SHA256=$actual"
          test "$actual" = "$expected"

      - name: Build signed Nexus Glasses 1.4.15 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :glasses-hub:assembleRelease

      - name: Verify Glasses APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          dir='glasses-hub/build/outputs/apk/release'
          mapfile -t files < <(find "$dir" -maxdepth 1 -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          glasses="$RUNNER_TEMP/nexus-glasses-1.4.15.apk"
          cp "${files[0]}" "$glasses"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          output="$("$apksigner" verify --print-certs "$glasses" 2>&1)"
          digest="$(printf '%s\n' "$output" | sed -nE 's/.*[Ss][Hh][Aa]-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$digest"
          test "$digest" = "$expected"

          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          badging="$("$aapt" dump badging "$glasses" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.glasses'"
          printf '%s\n' "$badging" | grep -F "versionCode='10415'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.15'"

          sha256="$(sha256sum "$glasses" | cut -d ' ' -f 1)"
          echo "glasses SHA256=$sha256"
          notes="$RUNNER_TEMP/nexus-glasses-1.4.15-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Glasses 1.4.15 — native telephony stabilization.

          - Built from the exact released Glasses 1.4.4 runtime line where native Rokid calling was not subject to Nexus launcher ownership logic.
          - RokidBusAccessibilityService.kt is verified bit-for-bit against the 1.4.4 release source.
          - No boot auto-restore, per-screen-wake ownership, AudioManager call yielding, Accessibility call-window heuristic, or Phone call-state bridge is present.
          - Keeps only the field-validated compact launcher geometry, selected-item scrolling, and removal of FLAG_KEEP_SCREEN_ON for native Rokid display timeout.
          - Phone stays on stable BuildGround Nexus Phone 1.4.14; this is a Glasses-only release.
          - Permanent BuildGround signer verified before publish: $digest.

          Artifact SHA-256: $sha256
          EOF
          sed -i 's/^          //' "$notes"
          {
            echo "GLASSES_APK=$glasses"
            echo "GLASSES_SHA256=$sha256"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub release v1.4.15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.15 >/dev/null 2>&1; then
            echo '::error::Release v1.4.15 already exists; refusing overwrite.'
            exit 1
          fi
          gh release create v1.4.15 "$GLASSES_APK" --target "$GITHUB_SHA" --title 'Rokid Nexus Glasses 1.4.15' --notes-file "$RELEASE_NOTES" --latest=false

      - name: Upload verified Glasses APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-glasses-1.4.15-signed-release
          path: ${{ runner.temp }}/nexus-glasses-1.4.15.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
