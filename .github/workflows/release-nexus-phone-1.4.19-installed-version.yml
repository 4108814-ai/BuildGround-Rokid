name: Release Nexus Phone 1.4.19 installed plugin version authority

on:
  push:
    branches:
      - release/nexus-phone-1.4.19-installed-version
    paths:
      - '.github/workflows/release-nexus-phone-1.4.19-installed-version.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-nexus-phone-1-4-19-installed-version
  cancel-in-progress: false

jobs:
  release-phone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Nexus Phone 1.4.19
        shell: bash
        run: |
          set -euo pipefail
          gradle='phone-hub/build.gradle.kts'
          grep -F 'versionCode = 10405' "$gradle"
          grep -F 'versionName = "1.4.5"' "$gradle"
          sed -i 's/versionCode = 10405/versionCode = 10419/' "$gradle"
          sed -i 's/versionName = "1.4.5"/versionName = "1.4.19"/' "$gradle"

          grep -F 'https://api.github.com/repos/4108814-ai/BuildGround-Rokid/releases?per_page=100' \
            phone-hub/src/main/java/com/anezium/rokidbus/phone/NexusUpdateChecker.kt
          grep -F 'https://raw.githubusercontent.com/4108814-ai/BuildGround-Rokid/main/registry/nexus-plugins.v1.json' \
            phone-hub/src/main/java/com/anezium/rokidbus/phone/RegistryClient.kt
          grep -F 'installedVersionNames' \
            phone-hub/src/main/java/com/anezium/rokidbus/phone/StoreCatalog.kt
          grep -F 'installedVersions(context.packageManager, packageNames)' \
            phone-hub/src/main/java/com/anezium/rokidbus/phone/StoreUi.kt
          grep -F 'installed entry displays package version name when registry snapshot is stale' \
            phone-hub/src/test/java/com/anezium/rokidbus/phone/StoreCatalogTest.kt

      - name: Test Nexus phone
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :phone-hub:testDebugUnitTest

      - name: Decode permanent BuildGround signing key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"
          echo "ARTIFACT_SIGNER_SHA256=$(printf '%s' "$actual" | tr -d ':' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - name: Build signed Nexus Phone 1.4.19 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleRelease

      - name: Verify APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find phone-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          artifact="$RUNNER_TEMP/nexus-phone-1.4.19.apk"
          cp "$apk" "$artifact"

          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$artifact" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$signer" = "$ARTIFACT_SIGNER_SHA256"

          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$artifact" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.phone'"
          printf '%s\n' "$badging" | grep -F "versionCode='10419'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.19'"

          sha="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          notes="$RUNNER_TEMP/nexus-phone-1.4.19-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Phone 1.4.19 — Installed Plugin Version Authority.

          - Fixes the Store/details mismatch where Android PackageManager could report Meetings 2.0.1 while Nexus displayed a stale registry snapshot such as 1.0.7.
          - Installed plugin version labels now come from Android PackageManager, the authoritative source for the APK actually installed on the phone.
          - Registry version metadata remains authoritative for UPDATE_AVAILABLE entries.
          - Adds regression coverage for installed 2.0.1 versus stale registry 1.0.7.
          - Meetings runtime, Nexus Glasses recorder control and Relay are unchanged.

          ### Artifact
          - File: nexus-phone-1.4.19.apk
          - SHA-256: $sha
          - Signer SHA-256: $signer
          EOF
          {
            echo "ARTIFACT=$artifact"
            echo "ARTIFACT_SHA=$sha"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Nexus Phone 1.4.19 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.4.19'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" "$ARTIFACT" \
            --target "$GITHUB_SHA" \
            --title 'Rokid Nexus Phone 1.4.19 — Installed Plugin Version Authority' \
            --notes-file "$RELEASE_NOTES" \
            --latest

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-phone-1.4.19-signed
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
