name: Meetings BuildGround release 2.0.0

on:
  push:
    branches:
      - feature/meetings-200-native-control
    paths:
      - '.github/workflows/meetings-buildground-release-2.0.0.yml'
      - '.github/scripts/apply-meetings-200-native-control.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meetings-buildground-release-2-0-0
  cancel-in-progress: false

jobs:
  release-meetings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Require corrected Nexus Glasses 1.4.20 bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view nexus-glasses-v1.4.20 --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Meetings baseline then collapse to 2.0 native control
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin feature/meeting-audio-transport
          transport_patch='.github/scripts/_apply-meeting-audio-transport.py'
          git show origin/feature/meeting-audio-transport:.github/scripts/apply-meeting-audio-transport.py > "$transport_patch"
          python "$transport_patch"
          rm -f "$transport_patch"

          conversation_patch='.github/patches/assistant-conversation-mode.patch'
          conversation_expected='a3e3bd757480267fcdf4a51d7acf60651efb6ba76f2ee33af4677c28e168df5a'
          test "$(sha256sum "$conversation_patch" | cut -d ' ' -f 1)" = "$conversation_expected"
          git apply --check "$conversation_patch"
          git apply "$conversation_patch"

          timeout_patch='.github/patches/assistant-conversation-timeout-ui-fix.patch'
          git apply --check "$timeout_patch"
          git apply "$timeout_patch"

          python .github/scripts/apply-assistant-phone-calls.py
          python .github/scripts/fix-assistant-phone-contact-constants.py
          python .github/scripts/normalize-assistant-phone-sms-input.py
          python .github/scripts/extend-assistant-phone-sms.py
          python .github/scripts/apply-assistant-mvp-integration.py
          python .github/scripts/fix-assistant-mvp-generated-settings.py
          python .github/scripts/fix-assistant-visual-policy.py
          python .github/scripts/apply-assistant-151-diagnostics.py
          python .github/scripts/apply-assistant-meeting-persistence.py
          python .github/scripts/apply-assistant-154-meetings-ui.py
          python .github/scripts/apply-assistant-155-silent-meeting.py
          python .github/scripts/apply-assistant-156-meeting-audio.py
          python .github/scripts/apply-assistant-156-raw-audio-core.py
          python .github/scripts/apply-assistant-156-unified-meeting-session.py
          python .github/scripts/apply-assistant-156-audio-ui-finish.py
          python .github/scripts/apply-assistant-157-audio-lease-stability.py
          python .github/scripts/apply-assistant-157-nullable-recovery-fix.py
          python .github/scripts/apply-assistant-160-work-mode.py
          python .github/scripts/apply-meetings-105-vault.py
          python .github/scripts/apply-meetings-106-direct-downloads.py
          python .github/scripts/apply-meetings-107-capture-lifecycle.py
          python .github/scripts/apply-meetings-200-native-control.py

          manifest='plugins/assistant/src/main/AndroidManifest.xml'
          service='plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantPluginService.kt'
          grep -q 'versionCode = 27' plugins/assistant/build.gradle.kts
          grep -q 'versionName = "2.0.0"' plugins/assistant/build.gradle.kts
          grep -q 'android:value="assistant"' "$manifest"
          grep -q 'android:value="Meetings"' "$manifest"
          grep -q 'android:value="surfaces"' "$manifest"
          grep -q 'android:value="/plugin/assistant/rokid-recording"' "$manifest"
          ! grep -q 'microphone' "$manifest"
          ! grep -q 'stt' "$manifest"
          ! grep -q 'tts' "$manifest"
          grep -q '/plugin/assistant/rokid-recording/request' "$service"
          grep -q '/plugin/assistant/rokid-recording/result' "$service"
          grep -q 'payload.optBoolean("confirmed", false)' "$service"
          grep -q 'REQUEST_TIMEOUT_MS = 15_000L' "$service"
          ! grep -q 'NexusAudioSession' "$service"
          ! grep -q 'meetingRecorder' "$service"
          ! grep -q 'transcriber' "$service"

      - name: Run Meetings tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :plugin-assistant:testDebugUnitTest -PskipCxrGlobal=true

      - name: Decode permanent BuildGround signing key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore_path"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore_path"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"
          echo "ARTIFACT_SIGNER_SHA256=$(printf '%s' "$actual" | tr -d ':' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - name: Build signed Meetings 2.0.0 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :plugin-assistant:assembleRelease -PskipCxrGlobal=true

      - name: Verify APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find plugins/assistant/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          actual_signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$actual_signer" = "$ARTIFACT_SIGNER_SHA256"
          artifact_name='meetings-phone-release.apk'
          artifact_path="$RUNNER_TEMP/$artifact_name"
          cp "$apk" "$artifact_path"
          sha256="$(sha256sum "$artifact_path" | cut -d ' ' -f 1)"
          size_bytes="$(stat -c '%s' "$artifact_path")"
          notes="$RUNNER_TEMP/meetings-2.0.0-notes.md"
          cat > "$notes" <<EOF
          BuildGround Meetings 2.0.0 — Rokid Native Recording Control.

          - Meetings is only a Start/Stop interface for Rokid's stock audio recorder.
          - The UI waits for Rokid's native result_audio_record confirmation before changing recording state.
          - No custom microphone lease, PCM/WAV capture, STT, transcript, protocol, Vault or Downloads export remains in the active Meetings runtime.
          - Rokid owns microphones, recording finalisation, its existing phone delivery and storage flow.
          - Requires corrected Nexus Glasses 1.4.20 native-recording bridge; 1.4.19 is superseded and must not be used for this test.
          - Hi Rokid remains the native assistant and Relay is unchanged.

          ### Artifact
          - File: $artifact_name
          - SHA-256: $sha256
          - Signer SHA-256: $actual_signer
          EOF
          {
            echo "ARTIFACT_NAME=$artifact_name"
            echo "ARTIFACT_PATH=$artifact_path"
            echo "ARTIFACT_SHA256=$sha256"
            echo "ARTIFACT_SIZE_BYTES=$size_bytes"
            echo "RELEASE_NOTES_PATH=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Meetings 2.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view meetings-v2.0.0 >/dev/null 2>&1; then
            echo '::error::meetings-v2.0.0 already exists; refusing overwrite.'
            exit 1
          fi
          gh release create meetings-v2.0.0 "$ARTIFACT_PATH" --target "$GITHUB_SHA" --title 'Meetings 2.0.0 — Rokid Native Control' --notes-file "$RELEASE_NOTES_PATH" --latest=false

      - name: Publish Meetings 2.0.0 to BuildGround registry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          registry_worktree="$RUNNER_TEMP/buildground-registry"
          rm -rf "$registry_worktree"
          git worktree add "$registry_worktree" origin/main
          current="$registry_worktree/registry/nexus-plugins.v1.json"
          artifact_url="https://github.com/$GITHUB_REPOSITORY/releases/download/meetings-v2.0.0/$ARTIFACT_NAME"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python - "$current" "$artifact_url" "$ARTIFACT_SHA256" "$ARTIFACT_SIGNER_SHA256" "$ARTIFACT_SIZE_BYTES" "$RELEASE_NOTES_PATH" "$published_at" <<'PY'
          import json, sys
          p,url,sha,signer,size,notes_path,published=sys.argv[1:]
          d=json.load(open(p, encoding='utf-8'))
          item=next((x for x in d['plugins'] if x.get('id')=='assistant'), None)
          if item is None: raise SystemExit('BuildGround Meetings registry identity assistant is missing')
          item['name']='Meetings'
          item['category']='Productivity'
          item['summary']='Meetings: Start/Stop control for the stock Rokid audio recorder.'
          item['description']='Thin BuildGround interface. Rokid owns microphones, recording, phone sync and storage; Meetings only sends Start/Stop and waits for native confirmation.'
          item['xBuildGroundManaged']=True
          nexus=item.setdefault('nexus', {})
          nexus['pluginId']='assistant'
          nexus['apiVersion']=3
          nexus['capabilities']=['surfaces']
          nexus['launchable']=True
          nexus.pop('settingsActivity', None)
          listing=item.setdefault('listing', {})
          listing['descriptionMarkdown']='## BuildGround Meetings\n\nThin Start/Stop control for the stock Rokid audio recorder. Rokid handles microphones, recording, finalisation, phone delivery and storage. Meetings does not capture or transcribe audio. Requires Nexus Glasses 1.4.20.'
          art=item.setdefault('artifact', {})
          art.update({'target':'phone','url':url,'sha256':sha,'signerSha256':signer,'sizeBytes':int(size),'packageName':'com.anezium.rokidbus.plugin.assistant','versionCode':27,'versionName':'2.0.0'})
          notes=open(notes_path, encoding='utf-8').read().strip()
          releases=[x for x in item.get('releases', []) if x.get('version') != '2.0.0']
          item['releases']=[{'version':'2.0.0','date':published,'notes':notes}] + releases
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          git -C "$registry_worktree" config user.name 'github-actions[bot]'
          git -C "$registry_worktree" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$registry_worktree" add registry/nexus-plugins.v1.json
          git -C "$registry_worktree" commit -m 'Publish Meetings 2.0.0 native Rokid control'
          git -C "$registry_worktree" push origin HEAD:main

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetings-2.0.0-signed
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
