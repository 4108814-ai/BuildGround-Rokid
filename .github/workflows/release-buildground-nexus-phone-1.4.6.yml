name: Release BuildGround Nexus phone 1.4.6

on:
  push:
    branches:
      - feature/meeting-audio-transport
    paths:
      - '.github/workflows/release-buildground-nexus-phone-1.4.6.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-phone-1.4.6
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus
    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply meeting-audio transport and bump phone to 1.4.6
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-meeting-audio-transport.py
          python - <<'PY'
          from pathlib import Path
          p = Path('phone-hub/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          if text.count('versionCode = 10405') != 1 or text.count('versionName = "1.4.5"') != 1:
              raise SystemExit('Expected phone 1.4.5 baseline exactly once')
          text = text.replace('versionCode = 10405', 'versionCode = 10406', 1)
          text = text.replace('versionName = "1.4.5"', 'versionName = "1.4.6"', 1)
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'versionCode = 10406' phone-hub/build.gradle.kts
          grep -F 'versionName = "1.4.6"' phone-hub/build.gradle.kts
          grep -F 'versionCode = 10404' glasses-hub/build.gradle.kts
          grep -F 'versionName = "1.4.4"' glasses-hub/build.gradle.kts
          grep -F 'AUDIO_PATH = "/stt/audio"' phone-hub/src/main/java/com/anezium/rokidbus/phone/SttWireProtocol.kt
          grep -F 'run.listener.onPcm(pcm, 0, pcm.size)' phone-hub/src/main/java/com/anezium/rokidbus/phone/speech/SpeechSessionManager.kt
          grep -F 'session?.onAudio(payload, data)' bus-client/src/main/java/com/anezium/rokidbus/client/plugin/NexusPluginClient.kt

      - name: Run Nexus phone tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :phone-hub:testDebugUnitTest :bus-client:testDebugUnitTest

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          echo "certificate SHA256=$actual"
          test "$actual" = "$expected"

      - name: Build signed Nexus phone 1.4.6 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleRelease

      - name: Prepare and verify phone update APK
        shell: bash
        run: |
          set -euo pipefail
          dir='phone-hub/build/outputs/apk/release'
          mapfile -t files < <(find "$dir" -maxdepth 1 -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          phone="$RUNNER_TEMP/nexus-phone-1.4.6.apk"
          cp "${files[0]}" "$phone"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          output="$("$apksigner" verify --print-certs "$phone" 2>&1)"
          digest="$(printf '%s\n' "$output" | sed -nE 's/.*[Ss][Hh][Aa]-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$digest" = "$expected"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          badging="$("$aapt" dump badging "$phone" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.phone'"
          printf '%s\n' "$badging" | grep -F "versionCode='10406'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.6'"
          sha256sum "$phone"
          notes="$RUNNER_TEMP/nexus-phone-1.4.6-notes.md"
          cat > "$notes" <<'EOF'
          BuildGround Nexus phone 1.4.6 — Meeting Audio Transport.

          - Adds an STT-session PCM tee so a plugin can archive the exact glasses microphone stream while recognition uses the same single microphone lease.
          - PCM frames are scoped to the active plugin/session and carry 16 kHz mono PCM16LE metadata.
          - Existing STT, audio-lease arbitration, Relay behavior and glasses runtime are unchanged.
          - Phone-only release: no glasses APK is published; glasses remain on 1.4.4.
          - Permanent BuildGround signer verified before publish.
          EOF
          sed -i 's/^          //' "$notes"
          {
            echo "PHONE_APK=$phone"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub release v1.4.6
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.6 >/dev/null 2>&1; then
            echo '::error::Release v1.4.6 already exists; refusing overwrite.'
            exit 1
          fi
          gh release create v1.4.6 "$PHONE_APK" --target "$GITHUB_SHA" --title 'Rokid Nexus 1.4.6' --notes-file "$RELEASE_NOTES" --latest

      - name: Upload verified phone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-phone-1.4.6-signed-release
          path: ${{ runner.temp }}/nexus-phone-1.4.6.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
