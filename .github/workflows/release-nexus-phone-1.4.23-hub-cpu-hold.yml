name: Release Nexus Phone 1.4.23 hub CPU hold

on:
  push:
    branches:
      - feature/nexus-phone-1423-hub-cpu-hold
    paths:
      - '.github/scripts/apply-nexus-phone-1421-notice-spp.py'
      - '.github/scripts/apply-nexus-phone-1422-cpu-hold.py'
      - '.github/scripts/apply-nexus-phone-1423-hub-cpu-hold.py'
      - '.github/workflows/release-nexus-phone-1.4.23-hub-cpu-hold.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-nexus-phone-1-4-23-hub-cpu-hold
  cancel-in-progress: false

jobs:
  release-phone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Phone 1.4.21, 1.4.22 and 1.4.23 patches
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python RokidNexus/.github/scripts/apply-nexus-phone-1421-notice-spp.py RokidNexus
          python RokidNexus/.github/scripts/apply-nexus-phone-1422-cpu-hold.py RokidNexus
          python RokidNexus/.github/scripts/apply-nexus-phone-1423-hub-cpu-hold.py RokidNexus

          gradle='RokidNexus/phone-hub/build.gradle.kts'
          hub='RokidNexus/phone-hub/src/main/java/com/anezium/rokidbus/phone/BusHubService.kt'
          manifest='RokidNexus/phone-hub/src/main/AndroidManifest.xml'

          grep -F 'versionCode = 10423' "$gradle"
          grep -F 'versionName = "1.4.23"' "$gradle"
          grep -F 'android.permission.WAKE_LOCK' "$manifest"
          grep -F 'private var hubCpuWakeLock: PowerManager.WakeLock? = null' "$hub"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$hub"
          grep -F '"rokidbus:phone-hub"' "$hub"
          grep -F 'updateHubCpuHold(true)' "$hub"
          grep -F 'updateHubCpuHold(false)' "$hub"
          grep -F 'Hub CPU hold acquired' "$hub"
          grep -F 'Hub CPU hold released' "$hub"
          if grep -F 'updateConnectedGlassesCpuHold(connected)' "$hub"; then
            echo '::error::CPU hold still follows vendor BT callback'
            exit 1
          fi

          # Preserve 1.4.20/1.4.21 transport behavior.
          grep -F 'private val sppRetryWake = java.util.concurrent.Semaphore(0)' "$hub"
          grep -F 'sppRetryWake.tryAcquire(delayMs, TimeUnit.MILLISECONDS)' "$hub"
          grep -F 'if (isNoticePath(envelope.path) && output != null)' "$hub"
          grep -F 'PluginBusJournal.Verdict.OK, "SPP_NOTICE"' "$hub"

          changed="$(git -C RokidNexus status --porcelain | awk '{print $2}')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^phone-hub/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Unexpected generated source changes outside phone-hub:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Test Nexus phone
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :phone-hub:testDebugUnitTest

      - name: Build debug smoke APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleDebug

      - name: Decode permanent BuildGround signing key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"
          echo "ARTIFACT_SIGNER_SHA256=$(printf '%s' "$actual" | tr -d ':' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - name: Build signed Nexus Phone 1.4.23 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleRelease

      - name: Verify APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find phone-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          artifact="$RUNNER_TEMP/nexus-phone-1.4.23.apk"
          cp "$apk" "$artifact"

          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$artifact" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$signer" = "$ARTIFACT_SIGNER_SHA256"

          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$artifact" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.phone'"
          printf '%s\n' "$badging" | grep -F "versionCode='10423'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.23'"

          sha="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          size="$(stat -c %s "$artifact")"
          notes="$RUNNER_TEMP/nexus-phone-1.4.23-notes.md"
          cat > "$notes" <<EOF
          BuildGround NEXUS Phone 1.4.23 — Hub CPU Hold.

          - Physical result on 1.4.22: audio still arrived immediately with the phone display off, while Relay visuals remained queued until merely waking the phone display to the lock screen.
          - 1.4.22 acquired/released its PARTIAL_WAKE_LOCK only from Hi Rokid's onGlassBtConnected callback. That vendor callback is therefore not used as the wake-lock ownership boundary in 1.4.23.
          - 1.4.23 acquires the non-reference-counted PARTIAL_WAKE_LOCK when BusHubService is created and keeps it for the entire hub-service lifetime, across transient CXR/BT callback changes.
          - The hold is released in BusHubService.onDestroy(). It does not turn the phone display on.
          - Preserves NEXUS Phone 1.4.21 notice SPP-first/CXR-fallback routing and 1.4.20 fast SPP recovery.
          - Phone-only change: NEXUS Glasses, Relay, Meetings, recorder, STT and audio behavior are unchanged.
          - This is the definitive CPU-suspend discriminator: if visuals still wait for phone-display wake, the remaining cause is not loss of CPU execution due to the 1.4.22 callback-scoped wake-lock policy.

          ### Artifact
          - File: nexus-phone-1.4.23.apk
          - SHA-256: $sha
          - Size: $size bytes
          - Signer SHA-256: $signer
          EOF
          {
            echo "ARTIFACT=$artifact"
            echo "ARTIFACT_SHA=$sha"
            echo "ARTIFACT_SIZE=$size"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Nexus Phone 1.4.23 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.4.23'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" "$ARTIFACT" \
            --target "$GITHUB_SHA" \
            --title 'NEXUS Phone 1.4.23 — Hub CPU Hold' \
            --notes-file "$RELEASE_NOTES" \
            --latest

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-phone-1.4.23-signed
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
