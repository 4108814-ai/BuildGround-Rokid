name: Release BuildGround Nexus Glasses 1.4.26 persistent autostart

on:
  push:
    branches:
      - buildground/nexus-glasses-1.4.26-autostart
    paths:
      - '.github/scripts/apply-buildground-autostart-1425.py'
      - '.github/scripts/apply-buildground-autostart-1426.py'
      - '.github/workflows/release-buildground-nexus-glasses-1.4.26.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-glasses-1-4-26
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround fork
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply BuildGround 1.4.24 chain and persistent autostart
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-buildground-lifecycle-1418.py
          python .github/scripts/apply-buildground-native-recording-1420.py
          python .github/scripts/apply-buildground-native-recording-1421.py
          python .github/scripts/apply-buildground-native-recording-1422.py
          python .github/scripts/apply-buildground-notice-viewport-1423.py
          python .github/scripts/apply-buildground-notice-wake-1424.py
          python .github/scripts/apply-buildground-autostart-1425.py
          python .github/scripts/apply-buildground-autostart-1426.py

          policy='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/DisplayWakePolicy.kt'
          renderer='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/NoticeOverlayRenderer.kt'
          service='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/BusHubService.kt'
          boot='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/BootReceiver.kt'
          lifecycle='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/GlassesLifecycleReceiver.kt'
          manifest='glasses-hub/src/main/AndroidManifest.xml'

          grep -F 'versionCode = 10426' glasses-hub/build.gradle.kts
          grep -F 'versionName = "1.4.26"' glasses-hub/build.gradle.kts
          grep -F 'isInteractive && !(kind == DisplayWakeKind.NOTICE && newNotice)' "$policy"
          grep -F 'PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP' "$policy"
          grep -F 'topMarginPx: Int' "$renderer"
          grep -F 'remainingViewport' "$renderer"
          grep -F 'BusHubService.ensureRunning(appContext)' "$boot"
          grep -F 'BusHubService.ensureRunning(appContext)' "$lifecycle"
          grep -F 'startForegroundService' "$service"
          grep -F 'return START_STICKY' "$service"
          grep -F 'android.permission.FOREGROUND_SERVICE' "$manifest"

      - name: Run glasses tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :glasses-hub:testDebugUnitTest

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build signed glasses APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :glasses-hub:assembleRelease

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find glasses-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          artifact="$RUNNER_TEMP/nexus-glasses-1.4.26.apk"
          cp "$apk" "$artifact"

          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$artifact" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$signer" = "$expected"

          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$artifact" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.glasses'"
          printf '%s\n' "$badging" | grep -F "versionCode='10426'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.26'"

          sha="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          notes="$RUNNER_TEMP/nexus-glasses-1.4.26-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Glasses 1.4.26 — Persistent Autostart.

          - Built from the exact BuildGround 1.4.24 generated chain that physically restored Relay notice viewport/wake behavior.
          - Adds only persistent ownership of the already-existing Glasses hub after BOOT_COMPLETED, USER_UNLOCKED and Rokid wear/temple recovery: BusHubService is foreground and START_STICKY while the original direct GlassesHub.start fallback remains.
          - Keeps the 1.4.23 notice viewport repair and 1.4.24 fresh-notice wake policy unchanged.
          - Does not include the separate nexus-glasses-v1.4.25 Meetings/recorder probe release.
          - Relay, NEXUS Phone, Meetings workflow and recorder logic are otherwise unchanged.
          - Package/signing continuity retained.

          ### Artifact
          - File: nexus-glasses-1.4.26.apk
          - SHA-256: $sha
          - Signer SHA-256: $signer
          EOF
          {
            echo "ARTIFACT=$artifact"
            echo "ARTIFACT_SHA=$sha"
            echo "NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Nexus Glasses 1.4.26 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='nexus-glasses-v1.4.26'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" "$ARTIFACT" --target "$GITHUB_SHA" --title 'Nexus Glasses 1.4.26 — Persistent Autostart' --notes-file "$NOTES" --latest=false

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-glasses-1.4.26-signed
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
