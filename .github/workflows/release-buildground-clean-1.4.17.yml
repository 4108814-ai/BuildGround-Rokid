name: Release BuildGround clean Nexus 1.4.17

on:
  push:
    branches:
      - reset/upstream-1.4.5-buildground
    paths:
      - '.github/scripts/apply-buildground-clean-1417.py'
      - '.github/workflows/release-buildground-clean-1.4.17.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-clean-1-4-17
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround fork
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify pristine upstream 1.4.5 runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          upstream='07589f480a68820dfda8eb9a29dd86045312c882'
          git merge-base --is-ancestor "$upstream" HEAD
          unexpected="$(git diff --name-only "$upstream" HEAD | grep -Ev '^\.github/(scripts/apply-buildground-clean-1417.py|workflows/release-buildground-clean-1.4.17.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Branch contains changes outside BuildGround release tooling:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          for module in phone-hub glasses-hub; do
            grep -F 'versionCode = 10405' "$module/build.gradle.kts"
            grep -F 'versionName = "1.4.5"' "$module/build.gradle.kts"
          done

      - name: Apply BuildGround ownership only
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-buildground-clean-1417.py
          for module in phone-hub glasses-hub; do
            grep -F 'versionCode = 10417' "$module/build.gradle.kts"
            grep -F 'versionName = "1.4.17"' "$module/build.gradle.kts"
          done
          grep -F 'https://api.github.com/repos/4108814-ai/BuildGround-Rokid/releases?per_page=100' phone-hub/src/main/java/com/anezium/rokidbus/phone/NexusUpdateChecker.kt
          grep -F 'https://raw.githubusercontent.com/4108814-ai/BuildGround-Rokid/main/registry/nexus-plugins.v1.json' phone-hub/src/main/java/com/anezium/rokidbus/phone/RegistryClient.kt

          mapfile -t changed < <(git diff --name-only | sort)
          printf 'generated runtime changes:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = 'glasses-hub/build.gradle.kts'
          test "${changed[1]}" = 'phone-hub/build.gradle.kts'
          test "${changed[2]}" = 'phone-hub/src/main/java/com/anezium/rokidbus/phone/NexusUpdateChecker.kt'
          test "${changed[3]}" = 'phone-hub/src/main/java/com/anezium/rokidbus/phone/RegistryClient.kt'

      - name: Run upstream runtime tests and build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :phone-hub:testDebugUnitTest :glasses-hub:testDebugUnitTest :phone-hub:assembleRelease :glasses-hub:assembleRelease

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Rebuild signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleRelease :glasses-hub:assembleRelease

      - name: Verify signer, package, version and hashes
        shell: bash
        run: |
          set -euo pipefail
          prepare_apk() {
            local module="$1" output="$2"
            local dir="$module/build/outputs/apk/release"
            mapfile -t files < <(find "$dir" -maxdepth 1 -type f -name '*.apk' -print)
            test "${#files[@]}" -eq 1
            cp "${files[0]}" "$output"
          }
          phone="$RUNNER_TEMP/nexus-phone-1.4.17.apk"
          glasses="$RUNNER_TEMP/nexus-glasses-1.4.17.apk"
          prepare_apk phone-hub "$phone"
          prepare_apk glasses-hub "$glasses"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          for apk in "$phone" "$glasses"; do
            output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            digest="$(printf '%s\n' "$output" | sed -nE 's/.*[Ss][Hh][Aa]-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
            echo "$(basename "$apk") signer=$digest"
            test "$digest" = "$expected"
          done
          phone_badging="$("$aapt" dump badging "$phone" | head -n 1)"
          glasses_badging="$("$aapt" dump badging "$glasses" | head -n 1)"
          printf '%s\n' "$phone_badging" | grep -F "name='com.anezium.rokidbus.phone'"
          printf '%s\n' "$phone_badging" | grep -F "versionCode='10417'"
          printf '%s\n' "$phone_badging" | grep -F "versionName='1.4.17'"
          printf '%s\n' "$glasses_badging" | grep -F "name='com.anezium.rokidbus.glasses'"
          printf '%s\n' "$glasses_badging" | grep -F "versionCode='10417'"
          printf '%s\n' "$glasses_badging" | grep -F "versionName='1.4.17'"

          phone_sha="$(sha256sum "$phone" | cut -d ' ' -f 1)"
          glasses_sha="$(sha256sum "$glasses" | cut -d ' ' -f 1)"
          echo "phone SHA256=$phone_sha"
          echo "glasses SHA256=$glasses_sha"
          notes="$RUNNER_TEMP/nexus-1.4.17-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus 1.4.17 — clean reset baseline from Anezium/Rokid-Nexus v1.4.5.

          - Runtime source is pristine upstream v1.4.5 (commit 07589f480a68820dfda8eb9a29dd86045312c882).
          - No BuildGround launcher ownership, wake, telephony, Assistant routing, Meeting, Relay, audio, or Glasses behavior patches are included.
          - BuildGround changes are limited to: forward-only version 1.4.17, BuildGround update feed, BuildGround plugin registry, and permanent BuildGround release signing.
          - Phone SHA-256: $phone_sha
          - Glasses SHA-256: $glasses_sha
          - Signer SHA-256: $expected
          EOF
          sed -i 's/^          //' "$notes"
          {
            echo "PHONE_APK=$phone"
            echo "GLASSES_APK=$glasses"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Publish clean reset release v1.4.17
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.17 >/dev/null 2>&1; then
            echo '::error::Release v1.4.17 already exists; refusing overwrite.'
            exit 1
          fi
          gh release create v1.4.17 "$PHONE_APK" "$GLASSES_APK" \
            --target "$GITHUB_SHA" \
            --title 'Rokid Nexus 1.4.17 — Clean Reset' \
            --notes-file "$RELEASE_NOTES" \
            --latest

      - name: Upload verified APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-1.4.17-clean-reset
          path: |
            ${{ runner.temp }}/nexus-phone-1.4.17.apk
            ${{ runner.temp }}/nexus-glasses-1.4.17.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
