name: Release BuildGround Nexus 1.4.18 lifecycle recovery

on:
  push:
    branches:
      - buildground/nexus-core-1.4.18-lifecycle-recovery
    paths:
      - 'glasses-hub/src/main/AndroidManifest.xml'
      - 'glasses-hub/src/main/assets/rokid-nexus-a11y-watchdog.sh'
      - 'glasses-hub/src/main/java/com/anezium/rokidbus/glasses/BootReceiver.kt'
      - 'glasses-hub/src/main/java/com/anezium/rokidbus/glasses/GlassesLifecycleReceiver.kt'
      - 'glasses-hub/src/main/java/com/anezium/rokidbus/glasses/SelfArmConstants.kt'
      - 'glasses-hub/src/test/java/com/anezium/rokidbus/glasses/GlassesLifecycleSignalTest.kt'
      - '.github/scripts/apply-buildground-lifecycle-1418.py'
      - '.github/workflows/release-buildground-nexus-1.4.18.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-1-4-18
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround fork
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply BuildGround ownership and 1.4.18 version
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-buildground-lifecycle-1418.py
          for module in phone-hub glasses-hub; do
            grep -F 'versionCode = 10418' "$module/build.gradle.kts"
            grep -F 'versionName = "1.4.18"' "$module/build.gradle.kts"
          done
          grep -F 'https://api.github.com/repos/4108814-ai/BuildGround-Rokid/releases?per_page=100' phone-hub/src/main/java/com/anezium/rokidbus/phone/NexusUpdateChecker.kt
          grep -F 'https://raw.githubusercontent.com/4108814-ai/BuildGround-Rokid/main/registry/nexus-plugins.v1.json' phone-hub/src/main/java/com/anezium/rokidbus/phone/RegistryClient.kt
          grep -F 'WATCHDOG_VERSION = "2026-09-05.1"' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/SelfArmConstants.kt
          grep -F 'VERSION="2026-09-05.1"' glasses-hub/src/main/assets/rokid-nexus-a11y-watchdog.sh

      - name: Run hub tests and build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :phone-hub:testDebugUnitTest :glasses-hub:testDebugUnitTest :phone-hub:assembleRelease :glasses-hub:assembleRelease

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Rebuild signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleRelease :glasses-hub:assembleRelease

      - name: Verify signer, package, version and hashes
        shell: bash
        run: |
          set -euo pipefail
          prepare_apk() {
            local module="$1" output="$2"
            local dir="$module/build/outputs/apk/release"
            mapfile -t files < <(find "$dir" -maxdepth 1 -type f -name '*.apk' -print)
            test "${#files[@]}" -eq 1
            cp "${files[0]}" "$output"
          }
          phone="$RUNNER_TEMP/nexus-phone-1.4.18.apk"
          glasses="$RUNNER_TEMP/nexus-glasses-1.4.18.apk"
          prepare_apk phone-hub "$phone"
          prepare_apk glasses-hub "$glasses"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          for apk in "$phone" "$glasses"; do
            output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            digest="$(printf '%s\n' "$output" | sed -nE 's/.*[Ss][Hh][Aa]-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
            echo "$(basename "$apk") signer=$digest"
            test "$digest" = "$expected"
          done

          phone_badging="$("$aapt" dump badging "$phone" | head -n 1)"
          glasses_badging="$("$aapt" dump badging "$glasses" | head -n 1)"
          printf '%s\n' "$phone_badging" | grep -F "name='com.anezium.rokidbus.phone'"
          printf '%s\n' "$phone_badging" | grep -F "versionCode='10418'"
          printf '%s\n' "$phone_badging" | grep -F "versionName='1.4.18'"
          printf '%s\n' "$glasses_badging" | grep -F "name='com.anezium.rokidbus.glasses'"
          printf '%s\n' "$glasses_badging" | grep -F "versionCode='10418'"
          printf '%s\n' "$glasses_badging" | grep -F "versionName='1.4.18'"

          phone_sha="$(sha256sum "$phone" | cut -d ' ' -f 1)"
          glasses_sha="$(sha256sum "$glasses" | cut -d ' ' -f 1)"
          echo "phone SHA256=$phone_sha"
          echo "glasses SHA256=$glasses_sha"

          notes="$RUNNER_TEMP/nexus-1.4.18-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus 1.4.18 — lifecycle recovery stability patch.

          - Restores the headless glasses hub after reboot using both BOOT_COMPLETED and Rokid's later USER_UNLOCKED edge.
          - Listens for Rokid temple-unfolded and glasses-worn system events and restores Nexus without opening any Activity or stealing the HUD.
          - Fixes the self-arm watchdog blind spot where Accessibility could remain enabled in secure settings while the Nexus process itself had died after fold/sleep.
          - The watchdog now requests an Accessibility rebind when the Nexus PID is absent, with a 30-second healthy fallback cadence and 5-second recovery cadence.
          - Fold/remove events never launch UI and never force the display awake.
          - Hi Rokid assistant ownership, telephony, audio routing, Meetings and Relay are unchanged.
          - Phone hub runtime is unchanged except BuildGround ownership/update metadata and the forward-only 1.4.18 version.
          - Phone SHA-256: $phone_sha
          - Glasses SHA-256: $glasses_sha
          - Signer SHA-256: $expected
          EOF
          sed -i 's/^          //' "$notes"
          {
            echo "PHONE_APK=$phone"
            echo "GLASSES_APK=$glasses"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Publish Nexus 1.4.18
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.18 >/dev/null 2>&1; then
            echo '::error::Release v1.4.18 already exists; refusing overwrite.'
            exit 1
          fi
          gh release create v1.4.18 "$PHONE_APK" "$GLASSES_APK" \
            --target "$GITHUB_SHA" \
            --title 'Rokid Nexus 1.4.18 — Lifecycle Recovery' \
            --notes-file "$RELEASE_NOTES" \
            --latest

      - name: Upload verified APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-1.4.18-lifecycle-recovery
          path: |
            ${{ runner.temp }}/nexus-phone-1.4.18.apk
            ${{ runner.temp }}/nexus-glasses-1.4.18.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
