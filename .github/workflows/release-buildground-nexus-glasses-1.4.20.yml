name: Release BuildGround Nexus Glasses 1.4.20 native recording

on:
  push:
    branches:
      - buildground/nexus-core-1.4.20-native-recording
    paths:
      - 'glasses-hub/src/main/aidl/com/rokid/os/sprite/assist/server/IAssistServer.aidl'
      - 'glasses-hub/src/main/aidl/com/rokid/os/sprite/assist/client/IAssistClient.aidl'
      - 'glasses-hub/src/main/java/com/anezium/rokidbus/glasses/RokidNativeRecordingController.kt'
      - '.github/scripts/apply-buildground-native-recording-1420.py'
      - '.github/workflows/release-buildground-nexus-glasses-1.4.20.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-glasses-1-4-20
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround fork
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply 1.4.18 lifecycle baseline and corrected 1.4.20 native recorder bridge
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-buildground-lifecycle-1418.py
          python .github/scripts/apply-buildground-native-recording-1420.py
          grep -F 'versionCode = 10420' glasses-hub/build.gradle.kts
          grep -F 'versionName = "1.4.20"' glasses-hub/build.gradle.kts
          grep -F 'RokidNativeRecordingController.REQUEST_PATH' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/GlassesHub.kt
          grep -F 'put("type", command)' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/RokidNativeRecordingController.kt
          grep -F 'audioOpenType' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/RokidNativeRecordingController.kt
          grep -F 'result_audio_record' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/RokidNativeRecordingController.kt
          grep -F 'void controlMsgJson(String packageName, String json);' glasses-hub/src/main/aidl/com/rokid/os/sprite/assist/server/IAssistServer.aidl
          grep -F 'boolean onMessageReceive(String messageJson);' glasses-hub/src/main/aidl/com/rokid/os/sprite/assist/client/IAssistClient.aidl

      - name: Run glasses tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :glasses-hub:testDebugUnitTest

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build signed glasses APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :glasses-hub:assembleRelease

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find glasses-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          artifact="$RUNNER_TEMP/nexus-glasses-1.4.20.apk"
          cp "$apk" "$artifact"

          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$artifact" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$signer" = "$expected"

          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$artifact" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.glasses'"
          printf '%s\n' "$badging" | grep -F "versionCode='10420'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.20'"

          sha="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          notes="$RUNNER_TEMP/nexus-glasses-1.4.20-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Glasses 1.4.20 — Corrected Rokid Native Recording Control.

          - Replaces the experimental 1.4.19 Binder guess with the exact stock Rokid AIDL contract used by MasterAssistService.
          - Uses Rokid JSON exactly as the native client does: type=cmd_start_audio_record / cmd_stop_audio_record with data.audioOpenType=audio_no_ui.
          - Waits for the stock result_audio_record callback before reporting a Start/Stop command as confirmed.
          - NEXUS never captures, copies, converts, transcribes or stores audio.
          - Rokid remains sole owner of microphones, recorder finalisation and the existing phone delivery/storage workflow.
          - The proven 1.4.18 lifecycle recovery behaviour is retained.
          - Hi Rokid assistant ownership and Relay are unchanged.

          ### Artifact
          - File: nexus-glasses-1.4.20.apk
          - SHA-256: $sha
          - Signer SHA-256: $signer
          EOF
          {
            echo "ARTIFACT=$artifact"
            echo "ARTIFACT_SHA=$sha"
            echo "NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Nexus Glasses 1.4.20 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='nexus-glasses-v1.4.20'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" "$ARTIFACT" --target "$GITHUB_SHA" --title 'Nexus Glasses 1.4.20 — Native Recording Control' --notes-file "$NOTES" --latest=false

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-glasses-1.4.20-signed
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
