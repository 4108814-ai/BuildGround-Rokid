name: Assistant BuildGround release 1.5.5

on:
  push:
    branches:
      - feature/assistant-conversation-mode
    paths:
      - '.github/workflows/assistant-buildground-release-1.5.5.yml'

permissions:
  contents: write

concurrency:
  group: assistant-buildground-release-1-5-5
  cancel-in-progress: false

jobs:
  release-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Assistant bundle with silent meeting mode and bump to 1.5.5
        shell: bash
        run: |
          set -euo pipefail

          conversation_patch='.github/patches/assistant-conversation-mode.patch'
          conversation_expected='a3e3bd757480267fcdf4a51d7acf60651efb6ba76f2ee33af4677c28e168df5a'
          test "$(sha256sum "$conversation_patch" | cut -d ' ' -f 1)" = "$conversation_expected"
          git apply --check "$conversation_patch"
          git apply "$conversation_patch"

          timeout_patch='.github/patches/assistant-conversation-timeout-ui-fix.patch'
          git apply --check "$timeout_patch"
          git apply "$timeout_patch"

          python .github/scripts/apply-assistant-phone-calls.py
          python .github/scripts/fix-assistant-phone-contact-constants.py
          python .github/scripts/normalize-assistant-phone-sms-input.py
          python .github/scripts/extend-assistant-phone-sms.py
          python .github/scripts/apply-assistant-mvp-integration.py
          python .github/scripts/fix-assistant-mvp-generated-settings.py
          python .github/scripts/fix-assistant-visual-policy.py
          python .github/scripts/apply-assistant-151-diagnostics.py
          python .github/scripts/apply-assistant-meeting-persistence.py
          python .github/scripts/apply-assistant-154-meetings-ui.py
          python .github/scripts/apply-assistant-155-silent-meeting.py

          python - <<'PY'
          from pathlib import Path
          p = Path('plugins/assistant/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          if text.count('versionCode = 11') != 1 or text.count('versionName = "1.5.1"') != 1:
              raise SystemExit('Expected generated Assistant 1.5.1 version markers exactly once')
          text = text.replace('versionCode = 11', 'versionCode = 15', 1)
          text = text.replace('versionName = "1.5.1"', 'versionName = "1.5.5"', 1)
          p.write_text(text, encoding='utf-8')
          PY

          grep -q 'versionCode = 15' plugins/assistant/build.gradle.kts
          grep -q 'versionName = "1.5.5"' plugins/assistant/build.gradle.kts
          grep -q 'class AssistantMeetingsActivity' plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantMeetingsActivity.kt
          grep -q 'AssistantMeetingsActivity::class.java' plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantSettingsActivity.kt
          grep -q 'fun meetings(): List<AssistantMeetingSummary>' plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantMeetingStore.kt
          grep -q 'meetingStore.saveProtocol' plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantPluginService.kt
          grep -q 'if (!meetingRecorder.active) uiController.showTranscript(text)' plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantPluginService.kt
          grep -q 'if (meetingProtocolId == null) showAnswer(answer.toString())' plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantPluginService.kt
          grep -q 'Протокол готов • сохранён на телефоне' plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantPluginService.kt
          ! grep -q 'uiController.showTransient("Совещание • запись")' plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantPluginService.kt
          ! grep -q 'uiController.showTransient("Совещание • .*фрагментов")' plugins/assistant/src/main/java/com/anezium/rokidbus/plugin/assistant/AssistantPluginService.kt
          test -z "$(git diff --name-only | grep -i relay || true)"

      - name: Run Assistant tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :plugin-assistant:testDebugUnitTest -PskipCxrGlobal=true

      - name: Decode permanent BuildGround signing key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore_path="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore_path"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore_path"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          echo "certificate SHA256=$actual"
          test "$actual" = "$expected"
          normalized="$(printf '%s' "$actual" | tr -d ':' | tr 'A-F' 'a-f')"
          echo "ARTIFACT_SIGNER_SHA256=$normalized" >> "$GITHUB_ENV"

      - name: Build signed Assistant 1.5.5 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :plugin-assistant:assembleRelease -PskipCxrGlobal=true

      - name: Verify APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find plugins/assistant/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          actual_signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 \
            | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$actual_signer" = "$ARTIFACT_SIGNER_SHA256"

          artifact_name='assistant-phone-release.apk'
          artifact_path="$RUNNER_TEMP/$artifact_name"
          cp "$apk" "$artifact_path"
          sha256="$(sha256sum "$artifact_path" | cut -d ' ' -f 1)"
          size_bytes="$(stat -c '%s' "$artifact_path")"
          metadata='plugins/assistant/build/outputs/apk/release/output-metadata.json'
          package_name="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["applicationId"])' "$metadata")"
          version_code="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["elements"][0]["versionCode"])' "$metadata")"
          version_name="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["elements"][0]["versionName"])' "$metadata")"
          test "$version_code" = '15'
          test "$version_name" = '1.5.5'
          test "$package_name" = 'com.anezium.rokidbus.plugin.assistant'

          notes="$RUNNER_TEMP/assistant-1.5.5-notes.md"
          cat > "$notes" <<EOF
          BuildGround Assistant 1.5.5 — Silent Meeting Session.

          - “Начать совещание” starts a meeting and immediately retires the Assistant HUD.
          - Meeting speech continues to be recognized and archived while the glasses stay visually quiet.
          - Partial transcripts, “Listening” states and per-fragment counters are suppressed during an active meeting.
          - Raw-audio transcription fallback is now meeting-aware and continues the silent capture loop.
          - “Закончить совещание” wakes the Assistant once, generates the protocol, stores protocol plus full transcript on the phone, and does not stream/read the full protocol on the glasses.
          - The glasses show only a short completion confirmation after the protocol is saved.
          - Existing Meetings archive, conversation mode, diagnostics, phone tools and Relay behavior are preserved.
          - No Relay changes.

          ### Artifact

          - File: \`$artifact_name\`
          - SHA-256: \`$sha256\`
          - Signer SHA-256: \`$actual_signer\`
          EOF

          {
            echo "ARTIFACT_NAME=$artifact_name"
            echo "ARTIFACT_PATH=$artifact_path"
            echo "ARTIFACT_SHA256=$sha256"
            echo "ARTIFACT_SIZE_BYTES=$size_bytes"
            echo "ARTIFACT_PACKAGE_NAME=$package_name"
            echo "ARTIFACT_VERSION_CODE=$version_code"
            echo "RELEASE_NOTES_PATH=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Assistant 1.5.5 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view assistant-v1.5.5 >/dev/null 2>&1; then
            echo '::error::assistant-v1.5.5 already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create assistant-v1.5.5 "$ARTIFACT_PATH" \
            --target "$GITHUB_SHA" \
            --title 'Assistant 1.5.5' \
            --notes-file "$RELEASE_NOTES_PATH" \
            --latest=false

      - name: Publish Assistant 1.5.5 to BuildGround registry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          registry_worktree="$RUNNER_TEMP/buildground-registry"
          rm -rf "$registry_worktree"
          git worktree add "$registry_worktree" origin/main
          current="$registry_worktree/registry/nexus-plugins.v1.json"
          upstream="$RUNNER_TEMP/upstream-registry.json"
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/Anezium/RokidBrew-Registry/main/dist/nexus-plugins.v1.json' \
            --output "$upstream"
          artifact_url="https://github.com/$GITHUB_REPOSITORY/releases/download/assistant-v1.5.5/$ARTIFACT_NAME"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python "$registry_worktree/.github/scripts/buildground_registry.py" publish \
            --current "$current" --upstream "$upstream" --output "$current" \
            --plugin-id assistant --version-name 1.5.5 \
            --version-code "$ARTIFACT_VERSION_CODE" --package-name "$ARTIFACT_PACKAGE_NAME" \
            --artifact-url "$artifact_url" --artifact-sha256 "$ARTIFACT_SHA256" \
            --signer-sha256 "$ARTIFACT_SIGNER_SHA256" --size-bytes "$ARTIFACT_SIZE_BYTES" \
            --published-at "$published_at" --release-notes-file "$RELEASE_NOTES_PATH"
          python -m json.tool "$current" >/dev/null
          cd "$registry_worktree"
          git config user.name 'BuildGround Release Bot'
          git config user.email '4108814-ai@users.noreply.github.com'
          git add registry/nexus-plugins.v1.json
          git commit -m 'Publish assistant 1.5.5 to BuildGround registry'
          git push origin HEAD:main

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildground-assistant-1.5.5-release
          path: ${{ runner.temp }}/assistant-phone-release.apk
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
