name: Release BuildGround Nexus Phone 1.4.13

on:
  push:
    branches:
      - feature/nexus-call-state-bridge
    paths:
      - '.github/workflows/release-buildground-nexus-phone-1.4.13.yml'
      - '.github/scripts/apply-phone-1413-api30-compat.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-phone-1.4.13
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus
    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply call-state bridge and Android 11 compatibility
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-phone-1413-api30-compat.py
          python - <<'PY'
          from pathlib import Path
          phone = Path('phone-hub/build.gradle.kts')
          text = phone.read_text(encoding='utf-8')
          if text.count('versionCode = 10405') != 1 or text.count('versionName = "1.4.5"') != 1:
              raise SystemExit('Expected phone 1.4.5 source baseline exactly once')
          text = text.replace('versionCode = 10405', 'versionCode = 10413', 1)
          text = text.replace('versionName = "1.4.5"', 'versionName = "1.4.13"', 1)
          phone.write_text(text, encoding='utf-8')
          PY
          grep -F 'versionCode = 10413' phone-hub/build.gradle.kts
          grep -F 'versionName = "1.4.13"' phone-hub/build.gradle.kts
          grep -F 'android.permission.READ_PHONE_STATE' phone-hub/src/main/AndroidManifest.xml
          grep -F 'TelephonyCallback.CallStateListener' phone-hub/src/main/java/com/anezium/rokidbus/phone/PhoneCallStateBridge.kt
          grep -F 'PhoneStateListener.LISTEN_CALL_STATE' phone-hub/src/main/java/com/anezium/rokidbus/phone/PhoneCallStateBridge.kt
          grep -F 'PHONE_CALL_STATE = "/phone/call/state"' shared/src/main/java/com/anezium/rokidbus/shared/BusConstants.kt

          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(phone-hub/|glasses-hub/|shared/|bus-client/)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Unexpected generated changes outside approved modules:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run coordinated unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :shared:testDebugUnitTest :phone-hub:testDebugUnitTest :glasses-hub:testDebugUnitTest :bus-client:testDebugUnitTest

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          echo "certificate SHA256=$actual"
          test "$actual" = "$expected"

      - name: Build signed Phone 1.4.13
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :phone-hub:assembleRelease

      - name: Verify APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          mapfile -t files < <(find 'phone-hub/build/outputs/apk/release' -maxdepth 1 -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          phone="$RUNNER_TEMP/nexus-phone-1.4.13.apk"
          cp "${files[0]}" "$phone"
          output="$("$apksigner" verify --print-certs "$phone" 2>&1)"
          digest="$(printf '%s\n' "$output" | sed -nE 's/.*[Ss][Hh][Aa]-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$digest" = "$expected"
          badging="$("$aapt" dump badging "$phone" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.phone'"
          printf '%s\n' "$badging" | grep -F "versionCode='10413'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.13'"
          phone_sha="$(sha256sum "$phone" | cut -d ' ' -f 1)"
          cat > "$RUNNER_TEMP/phone-notes.md" <<EOF
          BuildGround Nexus Phone 1.4.13 — authoritative phone-call state bridge.

          - Same call-state bridge prepared for the Glasses 1.4.12 gate, now published under the updater-compatible bare app tag v1.4.13.
          - Reads only RINGING / OFFHOOK / IDLE after the standard Android Phone permission; no phone numbers or caller identity are transported.
          - Uses TelephonyCallback on Android 12+ and a PhoneStateListener compatibility path on Android 11.
          - Preserves Phone Meeting Audio Transport and existing plugin/Relay/Assistant routing.
          - Permanent BuildGround signer verified before publish.

          Artifact SHA-256: $phone_sha
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/phone-notes.md"
          {
            echo "PHONE_APK=$phone"
            echo "PHONE_NOTES=$RUNNER_TEMP/phone-notes.md"
          } >> "$GITHUB_ENV"

      - name: Publish Phone v1.4.13
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.13 >/dev/null 2>&1; then
            echo '::error::Release v1.4.13 already exists; refusing overwrite.'
            exit 1
          fi
          gh release create v1.4.13 "$PHONE_APK" --target "$GITHUB_SHA" --title 'Rokid Nexus Phone 1.4.13' --notes-file "$PHONE_NOTES" --latest=false
          gh release view v1.4.13 --json tagName,assets --jq '.tagName, .assets[].name' | grep -Fx 'v1.4.13'
          gh release view v1.4.13 --json assets --jq '.assets[].name' | grep -Fx 'nexus-phone-1.4.13.apk'

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-phone-1.4.13-signed-release
          path: ${{ runner.temp }}/nexus-phone-1.4.13.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
