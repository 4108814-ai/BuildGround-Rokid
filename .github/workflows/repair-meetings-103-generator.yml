name: Repair Meetings 1.0.3 generator

on:
  push:
    branches:
      - feature/meetings-103
    paths:
      - '.github/workflows/repair-meetings-103-generator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feature/meetings-103
          fetch-depth: 0

      - name: Repair exact protocol matcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-meetings-103.py')
          text = path.read_text(encoding='utf-8')
          old = '''if text.count(old_protocol) != 1:
              raise SystemExit(f"protocol completion branch: expected one match, found {text.count(old_protocol)}")
          text = text.replace(old_protocol, new_protocol, 1)
          SERVICE.write_text(text, encoding="utf-8")
          '''
          new = '''if text.count(old_protocol) == 1:
              text = text.replace(old_protocol, new_protocol, 1)
          else:
              protocol_pattern = re.compile(
                  r"                if \\(meetingProtocolId != null\\) \\{\\n.*?"
                  r"                \\} else \\{\\n",
                  re.DOTALL,
              )
              text, count = protocol_pattern.subn(new_protocol, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f"protocol completion branch: exact={text.count(old_protocol)} regex={count}"
                  )
          SERVICE.write_text(text, encoding="utf-8")
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one strict protocol matcher block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          grep -q 'protocol_pattern = re.compile' .github/scripts/apply-meetings-103.py

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/apply-meetings-103.py
          git commit -m 'Fix Meetings 1.0.3 protocol completion matcher'
          git push origin HEAD:feature/meetings-103
