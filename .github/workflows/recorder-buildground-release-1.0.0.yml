name: Recorder BuildGround release 1.0.0

on:
  push:
    branches:
      - feature/nexus-recorder-100
    paths:
      - '.github/workflows/recorder-buildground-release-1.0.0.yml'
      - 'plugins/recorder/**'
      - 'bus-client/**'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recorder-buildground-release-1-0-0
  cancel-in-progress: true

jobs:
  release-recorder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Recorder architecture
        shell: bash
        run: |
          set -euo pipefail
          manifest='plugins/recorder/src/main/AndroidManifest.xml'
          service='plugins/recorder/src/main/java/com/buildground/nexus/recorder/RecorderPluginService.kt'
          plugin_base='bus-client/src/main/java/com/anezium/rokidbus/client/plugin/NexusPluginService.kt'
          grep -q 'android:value="recorder"' "$manifest"
          grep -q 'android:value="surfaces,microphone"' "$manifest"
          grep -q 'override fun retainNexusAudioOnClose' "$service"
          grep -q 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' "$service"
          grep -q 'BuildGround_Recording_' "$service"
          grep -q 'CHECKPOINT_MS = 2_000L' "$service"
          grep -q 'if (!retainAudio) client?.releaseAudioSession()' "$plugin_base"
          grep -q 'versionName = "1.0.0"' plugins/recorder/build.gradle.kts

      - name: Run Recorder tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :plugin-recorder:testDebugUnitTest -PskipCxrGlobal=true

      - name: Decode permanent BuildGround signing key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore_path"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore_path"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"
          echo "ARTIFACT_SIGNER_SHA256=$(printf '%s' "$actual" | tr -d ':' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - name: Build signed Recorder APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :plugin-recorder:assembleRelease -PskipCxrGlobal=true

      - name: Verify APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find plugins/recorder/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          actual_signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$actual_signer" = "$ARTIFACT_SIGNER_SHA256"
          artifact_name='recorder-phone-release.apk'
          artifact_path="$RUNNER_TEMP/$artifact_name"
          cp "$apk" "$artifact_path"
          sha256="$(sha256sum "$artifact_path" | cut -d ' ' -f 1)"
          size_bytes="$(stat -c '%s' "$artifact_path")"
          notes="$RUNNER_TEMP/recorder-1.0.0-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Recorder 1.0.0.

          - Dedicated raw glasses-audio recorder independent from Meetings UI lifecycle.
          - Start/Stop from the Nexus launcher; reopening Recorder restores the live Stop control.
          - WAV is created directly in the phone Downloads root as BuildGround_Recording_<date>_<time>.wav.
          - The WAV header is checkpointed every two seconds so an interrupted service leaves a recoverable user-visible recording.
          - No STT, protocol generation or Hi Rokid assistant interception in this layer.
          - This release is the standalone recorder foundation; Meetings integration follows after physical-device WAV validation.

          ### Artifact
          - File: \`$artifact_name\`
          - SHA-256: \`$sha256\`
          - Signer SHA-256: \`$actual_signer\`
          EOF
          {
            echo "ARTIFACT_NAME=$artifact_name"
            echo "ARTIFACT_PATH=$artifact_path"
            echo "ARTIFACT_SHA256=$sha256"
            echo "ARTIFACT_SIZE_BYTES=$size_bytes"
            echo "RELEASE_NOTES_PATH=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Recorder release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view recorder-v1.0.0 >/dev/null 2>&1; then
            gh release delete recorder-v1.0.0 --yes --cleanup-tag || true
          fi
          gh release create recorder-v1.0.0 "$ARTIFACT_PATH" --target "$GITHUB_SHA" --title 'Nexus Recorder 1.0.0' --notes-file "$RELEASE_NOTES_PATH" --latest=false

      - name: Publish Recorder to BuildGround registry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          registry_worktree="$RUNNER_TEMP/buildground-recorder-registry"
          rm -rf "$registry_worktree"
          git worktree add "$registry_worktree" origin/main
          current="$registry_worktree/registry/nexus-plugins.v1.json"
          artifact_url="https://github.com/$GITHUB_REPOSITORY/releases/download/recorder-v1.0.0/$ARTIFACT_NAME"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python - "$current" "$artifact_url" "$ARTIFACT_SHA256" "$ARTIFACT_SIGNER_SHA256" "$ARTIFACT_SIZE_BYTES" "$RELEASE_NOTES_PATH" "$published_at" <<'PY'
          import json, sys
          p,url,sha,signer,size,notes_path,published=sys.argv[1:]
          d=json.load(open(p, encoding='utf-8'))
          item=next((x for x in d['plugins'] if x.get('id')=='recorder'), None)
          if item is None:
              item={'id':'recorder','kind':'nexus-plugin'}
              d['plugins'].append(item)
          item.update({
              'name':'Recorder',
              'category':'Productivity',
              'summary':'Dedicated Nexus source-audio recorder with direct WAV files in Downloads.',
              'description':'Recorder owns the glasses microphone independently from HUD and Meetings lifecycle. Source WAV is the primary durable artifact.',
              'author':'BuildGround',
              'sourceUrl':'https://github.com/4108814-ai/BuildGround-Rokid',
              'publishedAt': item.get('publishedAt') or published,
              'xBuildGroundManaged':True,
              'screenshotAssets':[],
              'listing':{'descriptionMarkdown':'## Nexus Recorder\n\nDedicated source-audio layer for BuildGround on Rokid glasses.\n\n- Start and stop from the Nexus launcher.\n- Recording continues when the HUD closes or the display sleeps.\n- Reopen Recorder to see the active recording and Stop control.\n- WAV is written directly to the phone Downloads folder.\n- No transcription or AI dependency: audio is preserved first.\n'},
              'nexus':{
                  'pluginId':'recorder',
                  'apiVersion':3,
                  'capabilities':['surfaces','microphone'],
                  'launchable':True,
                  'minHostVersionCode':10405,
              },
          })
          item['artifact']={
              'target':'phone','url':url,'sha256':sha,'signerSha256':signer,
              'sizeBytes':int(size),'packageName':'com.buildground.nexus.recorder',
              'versionCode':1,'versionName':'1.0.0'
          }
          notes=open(notes_path, encoding='utf-8').read().strip()
          releases=[x for x in item.get('releases', []) if x.get('version') != '1.0.0']
          item['releases']=[{'version':'1.0.0','date':published,'notes':notes}] + releases
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          git -C "$registry_worktree" config user.name 'github-actions[bot]'
          git -C "$registry_worktree" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$registry_worktree" add registry/nexus-plugins.v1.json
          git -C "$registry_worktree" commit -m 'Publish Nexus Recorder 1.0.0'
          git -C "$registry_worktree" push origin HEAD:main

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-recorder-1.0.0-signed
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
