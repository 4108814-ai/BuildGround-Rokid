name: Recorder compile diagnostics

on:
  push:
    branches:
      - feature/nexus-recorder-100
    paths:
      - '.github/workflows/recorder-compile-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus
    steps:
      - uses: actions/checkout@v6
        with:
          path: RokidNexus
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and capture output
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :plugin-recorder:testDebugUnitTest -PskipCxrGlobal=true --stacktrace > "$RUNNER_TEMP/recorder-gradle.log" 2>&1
          echo $? > "$RUNNER_TEMP/recorder-gradle.status"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: recorder-compile-log
          path: |
            ${{ runner.temp }}/recorder-gradle.log
            ${{ runner.temp }}/recorder-gradle.status
          if-no-files-found: error
