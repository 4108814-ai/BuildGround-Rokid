name: Release BuildGround Nexus Glasses 1.4.27 integrated Network Bridge probe

on:
  push:
    branches:
      - buildground/nexus-glasses-1.4.27-network-bridge-probe
    paths:
      - '.github/scripts/apply-buildground-network-bridge-probe-1427.py'
      - '.github/workflows/release-buildground-nexus-glasses-1.4.27.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-glasses-1-4-27
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround fork
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply exact 1.4.26 chain plus integrated bridge probe
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-buildground-lifecycle-1418.py
          python .github/scripts/apply-buildground-native-recording-1420.py
          python .github/scripts/apply-buildground-native-recording-1421.py
          python .github/scripts/apply-buildground-native-recording-1422.py
          python .github/scripts/apply-buildground-notice-viewport-1423.py
          python .github/scripts/apply-buildground-notice-wake-1424.py
          python .github/scripts/apply-buildground-autostart-1425.py
          python .github/scripts/apply-buildground-autostart-1426.py
          python .github/scripts/apply-buildground-network-bridge-probe-1427.py

          policy='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/DisplayWakePolicy.kt'
          renderer='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/NoticeOverlayRenderer.kt'
          service='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/BusHubService.kt'
          boot='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/BootReceiver.kt'
          lifecycle='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/GlassesLifecycleReceiver.kt'
          manifest='glasses-hub/src/main/AndroidManifest.xml'
          main='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/MainActivity.kt'
          probe='glasses-hub/src/main/java/com/anezium/rokidbus/glasses/NetworkBridgeProbeActivity.kt'

          grep -F 'versionCode = 10427' glasses-hub/build.gradle.kts
          grep -F 'versionName = "1.4.27"' glasses-hub/build.gradle.kts

          # Preserve physically validated 1.4.23 / 1.4.24 behavior.
          grep -F 'isInteractive && !(kind == DisplayWakeKind.NOTICE && newNotice)' "$policy"
          grep -F 'PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP' "$policy"
          grep -F 'topMarginPx: Int' "$renderer"
          grep -F 'remainingViewport' "$renderer"

          # Preserve 1.4.26 persistent autostart ownership.
          grep -F 'BusHubService.ensureRunning(appContext)' "$boot"
          grep -F 'BusHubService.ensureRunning(appContext)' "$lifecycle"
          grep -F 'startForegroundService' "$service"
          grep -F 'return START_STICKY' "$service"
          grep -F 'android.permission.FOREGROUND_SERVICE' "$manifest"

          # Integrated Network Bridge probe contract.
          grep -F 'NetworkBridgeProbeActivity' "$manifest"
          grep -F 'startActivity(Intent(this, NetworkBridgeProbeActivity::class.java))' "$main"
          grep -F 'https://api.openai.com/v1/models' "$probe"
          grep -F 'LinkStateBits.SPP_DATA_UP' "$probe"
          grep -F 'PATH_HTTP_REQUEST' "$probe"
          grep -F 'client?.trySend(' "$probe"
          grep -F 'BRIDGE OK' "$probe"
          grep -F 'BRIDGE TIMEOUT' "$probe"
          grep -F 'PHONE LINK DOWN' "$probe"
          if grep -E 'java\.net|HttpURLConnection|OkHttp|URL\(' "$probe"; then
            echo '::error::Integrated bridge probe must not perform direct HTTP on glasses'
            exit 1
          fi

      - name: Run glasses tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :glasses-hub:testDebugUnitTest

      - name: Build debug smoke APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :glasses-hub:assembleDebug

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build signed glasses APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :glasses-hub:assembleRelease

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find glasses-hub/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          artifact="$RUNNER_TEMP/nexus-glasses-1.4.27.apk"
          cp "$apk" "$artifact"

          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$artifact" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$signer" = "$expected"

          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$artifact")"
          printf '%s\n' "$badging" | head -n 1 | grep -F "name='com.anezium.rokidbus.glasses'"
          printf '%s\n' "$badging" | head -n 1 | grep -F "versionCode='10427'"
          printf '%s\n' "$badging" | head -n 1 | grep -F "versionName='1.4.27'"
          printf '%s\n' "$badging" | grep -F "launchable-activity: name='com.anezium.rokidbus.glasses.MainActivity'"

          sha="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          size="$(stat -c %s "$artifact")"
          notes="$RUNNER_TEMP/nexus-glasses-1.4.27-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Glasses 1.4.27 — Integrated Network Bridge Probe.

          - Built from the exact 1.4.26 generated chain.
          - Keeps physically validated 1.4.23 notice geometry and 1.4.24 fresh-notice wake policy unchanged.
          - Keeps 1.4.26 foreground START_STICKY persistent autostart unchanged.
          - Adds one internal NetworkBridgeProbeActivity inside the normal NEXUS Glasses package; no separate launcher app is required.
          - Opening normal NEXUS automatically opens the probe screen for this temporary test release.
          - Probe waits for SPP_DATA_UP, then sends https://api.openai.com/v1/models only through RokidBus /http/request.
          - Probe source contains no direct HTTP implementation; Phone performs the external request.
          - Expected success is BRIDGE OK with a real HTTP status; HTTP 401 is expected because no API key is used.
          - BRIDGE FAIL / PHONE LINK DOWN means SPP DATA did not come up within 20 seconds.
          - BRIDGE TIMEOUT means SPP was up but no terminal HTTP reply returned within 30 seconds.
          - Phone 1.4.25 and Relay 1.2.7 are unchanged.

          ### Artifact
          - File: nexus-glasses-1.4.27.apk
          - Package: com.anezium.rokidbus.glasses
          - versionCode: 10427
          - versionName: 1.4.27
          - SHA-256: $sha
          - Size: $size bytes
          - Signer SHA-256: $signer
          EOF
          {
            echo "ARTIFACT=$artifact"
            echo "ARTIFACT_SHA=$sha"
            echo "ARTIFACT_SIZE=$size"
            echo "NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Create Nexus Glasses 1.4.27 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='nexus-glasses-v1.4.27'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" "$ARTIFACT" \
            --target "$GITHUB_SHA" \
            --title 'Nexus Glasses 1.4.27 — Network Bridge Probe' \
            --notes-file "$NOTES" \
            --latest=false

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-glasses-1.4.27-signed
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
