name: Release BuildGround Nexus glasses 1.4.8

on:
  push:
    branches:
      - feature/nexus-glasses-call-yield
    paths:
      - '.github/workflows/release-buildground-nexus-glasses-1.4.8.yml'
      - '.github/scripts/apply-nexus-glasses-148-call-yield.py'
      - '.github/scripts/apply-nexus-glasses-147-launcher-restore.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-buildground-nexus-glasses-1-4-8
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus

    steps:
      - name: Check out BuildGround-Rokid
        uses: actions/checkout@v6
        with:
          path: RokidNexus
          fetch-depth: 0

      - name: Check out CxrGlobal 0.2.3
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.2.3
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply launcher restore + native call yield and bump to 1.4.8
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-nexus-glasses-148-call-yield.py
          python - <<'PY'
          from pathlib import Path
          p = Path('glasses-hub/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          if text.count('versionCode = 10404') != 1 or text.count('versionName = "1.4.4"') != 1:
              raise SystemExit('Expected Nexus Glasses 1.4.4 baseline exactly once')
          text = text.replace('versionCode = 10404', 'versionCode = 10408', 1)
          text = text.replace('versionName = "1.4.4"', 'versionName = "1.4.8"', 1)
          p.write_text(text, encoding='utf-8')
          PY

          grep -F 'versionCode = 10408' glasses-hub/build.gradle.kts
          grep -F 'versionName = "1.4.8"' glasses-hub/build.gradle.kts
          grep -F 'registerNativeCallModeObserver()' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/RokidBusAccessibilityService.kt
          grep -F 'NativeCallUiPolicy.isCallMode(mode)' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/RokidBusAccessibilityService.kt
          grep -F '!nativeCallActive && LauncherAutoRestorePolicy.shouldRestore(' glasses-hub/src/main/java/com/anezium/rokidbus/glasses/RokidBusAccessibilityService.kt
          grep -F 'MODE_IN_COMMUNICATION' glasses-hub/src/test/java/com/anezium/rokidbus/glasses/NativeCallUiPolicyTest.kt

          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^glasses-hub/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo '::error::Unexpected generated changes outside glasses-hub:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Run Nexus Glasses tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :glasses-hub:testDebugUnitTest

      - name: Decode permanent BuildGround release key
        shell: bash
        env:
          NEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          keystore="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          {
            echo "NEXUS_RELEASE_KEYSTORE=$keystore"
            echo "NEXUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "NEXUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify permanent BuildGround certificate
        shell: bash
        run: |
          set -euo pipefail
          expected='55:B2:21:85:39:2B:8C:1F:08:4C:3D:EC:58:BB:0F:34:2E:CE:71:02:28:95:56:AE:23:CA:DE:E6:CC:EC:20:97'
          details="$(keytool -list -v -keystore "$NEXUS_RELEASE_KEYSTORE" -storepass "$NEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$NEXUS_RELEASE_KEY_ALIAS")"
          actual="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          echo "certificate SHA256=$actual"
          test "$actual" = "$expected"

      - name: Build signed Nexus Glasses 1.4.8 APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :glasses-hub:assembleRelease

      - name: Verify Glasses APK and prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          dir='glasses-hub/build/outputs/apk/release'
          mapfile -t files < <(find "$dir" -maxdepth 1 -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          glasses="$RUNNER_TEMP/nexus-glasses-1.4.8.apk"
          cp "${files[0]}" "$glasses"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected='55b22185392b8c1f084c3dec58bb0f342ece7102289556ae23cadee6ccec2097'
          output="$("$apksigner" verify --print-certs "$glasses" 2>&1)"
          digest="$(printf '%s\n' "$output" | sed -nE 's/.*[Ss][Hh][Aa]-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$digest"
          test "$digest" = "$expected"

          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          badging="$("$aapt" dump badging "$glasses" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='com.anezium.rokidbus.glasses'"
          printf '%s\n' "$badging" | grep -F "versionCode='10408'"
          printf '%s\n' "$badging" | grep -F "versionName='1.4.8'"

          sha256="$(sha256sum "$glasses" | cut -d ' ' -f 1)"
          echo "glasses SHA256=$sha256"
          notes="$RUNNER_TEMP/nexus-glasses-1.4.8-notes.md"
          cat > "$notes" <<EOF
          BuildGround Nexus Glasses 1.4.8 — native call UI priority hotfix.

          - Keeps the 1.4.7 Nexus-first launcher restoration behavior.
          - Incoming ringtone and cellular call audio modes temporarily hide the Nexus launcher so the native Rokid caller/callee UI is visible.
          - All temple and R08 key events pass through to native Rokid while telephone call UI priority is active.
          - After the call ends, Nexus returns automatically only when it was the visible shell before the call and no plugin surface, activity or notice owns the display.
          - Service recreation during an active telephone call cannot auto-cover the native call UI.
          - MODE_IN_COMMUNICATION is deliberately excluded, so Assistant/STT/ordinary voice sessions do not trigger call yielding.
          - Nexus Phone, Assistant, Relay, CXR/Bluetooth transport and audio arbitration are unchanged.
          - Permanent BuildGround signer verified before publish: $digest.

          Artifact SHA-256: $sha256
          EOF
          sed -i 's/^          //' "$notes"
          {
            echo "GLASSES_APK=$glasses"
            echo "GLASSES_SHA256=$sha256"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub release v1.4.8
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.8 >/dev/null 2>&1; then
            echo '::error::Release v1.4.8 already exists; refusing overwrite.'
            exit 1
          fi
          gh release create v1.4.8 "$GLASSES_APK" --target "$GITHUB_SHA" --title 'Rokid Nexus 1.4.8' --notes-file "$RELEASE_NOTES" --latest=false

      - name: Upload verified Glasses APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-glasses-1.4.8-signed-release
          path: ${{ runner.temp }}/nexus-glasses-1.4.8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
